schema_version: 1
updated: 2026-09-15
mission: >-
  Durable institutional memory for optimizer findings and research leads. Nothing
  valuable should exist only because we remember talking about it.

policy:
  ui_moratorium_scope: "UI/presentation only"
  public_surface: false
  issue_role: "Execution objects for promoted actionable work; not the monitoring database."
  lifecycle: [discovered, recorded, monitored, promoted, execution, commissioned, closed]
  research_graduation:
    states: [needs_investigation, under_investigation, findings_established]
    rule: >-
      A retained finding may graduate into Research when significance/evidence warrants a
      durable public research subject. Research includes work needing investigation and work
      actively under investigation; it need not wait for a final answer.
    evidence_lanes: [community, documentary_regulatory, manufacturer, commercial, gr_lab, inferred, hypothesis, disproven, unknown]
    community_research: >-
      Community Research is subordinate to Research as an evidence/source lane. Preserve
      attribution and distinguish community findings from independent GlassesResearch
      reproduction. A community-originated subject may graduate into broader Research and
      later gain documentary or GR lab evidence without rewriting its provenance.
  invariants:
    - stable unique id required
    - grade must be VERY_HIGH HIGH MEDIUM or LOW
    - first_seen and last_reviewed required
    - promoted actionable work links an execution issue when one exists
    - closure or demotion preserves disposition/history rather than deleting the record
    - public presentation is never generated directly from this internal ledger
    - UI-bound findings remain non-implementable during the UI moratorium
    - optimizer runs update existing subjects instead of creating duplicates for new evidence

