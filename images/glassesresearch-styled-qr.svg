<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
<title id="title">GlassesResearch QR card</title>
<desc id="desc">Scannable QR code linking to https://glassesresearch.org/ with GlassesResearch branding.</desc>
<rect width="640" height="720" rx="36" fill="#ffffff"/>
<rect x="18" y="18" width="604" height="684" rx="28" fill="none" stroke="#0a3152" stroke-width="12"/>
<image href="glassesresearch-url-qr.svg" x="88" y="70" width="464" height="464" preserveAspectRatio="xMidYMid meet"/>
<g transform="translate(190 258)">
  <rect x="0" y="0" width="260" height="118" rx="20" fill="#ffffff"/>
  <g stroke="#0a3152" stroke-width="10" fill="none">
    <rect x="38" y="20" width="70" height="42" rx="16"/>
    <rect x="152" y="20" width="70" height="42" rx="16"/>
    <path d="M108 40h44"/>
  </g>
  <g fill="#2f82be">
    <rect x="219" y="8" width="10" height="10"/>
    <rect x="232" y="-5" width="10" height="10"/>
    <rect x="232" y="21" width="10" height="10"/>
  </g>
  <text x="130" y="91" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#0a3152">Glasses<tspan fill="#2f82be">Research</tspan></text>
</g>
<text x="320" y="585" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="3" fill="#0a3152">UNDERSTAND THE GLASSES.</text>
<text x="320" y="617" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="3" fill="#0a3152">OWN THE CHOICES.</text>
<text x="320" y="665" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="2" fill="#0a3152">GLASSESRESEARCH.ORG</text>
</svg>
