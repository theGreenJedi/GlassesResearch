name: GlassesResearch Analytics Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analytics_report.py'
      - '.github/workflows/analytics-report.yml'
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: analytics-report
  cancel-in-progress: false

jobs:
  analytics-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analytics dependencies
        run: python -m pip install --quiet requests google-auth

      - name: Generate consolidated report
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: python scripts/analytics_report.py

      - name: Publish latest snapshot and history
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- analytics/)" ]; then
            echo 'Analytics snapshot unchanged; nothing to commit.'
            exit 0
          fi

          git config user.name 'glassesresearch-analytics-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          tmpdir="$(mktemp -d)"
          history_file="analytics/history/$(date -u +%F).json"
          mkdir -p "$tmpdir/analytics/history"
          cp analytics/latest.md "$tmpdir/analytics/latest.md"
          cp analytics/latest.json "$tmpdir/analytics/latest.json"
          cp "$history_file" "$tmpdir/$history_file"

          # Re-apply only this run's generated files to the current remote tip.
          # This avoids rebase conflicts when another automation updates main.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p analytics/history
            cp "$tmpdir/analytics/latest.md" analytics/latest.md
            cp "$tmpdir/analytics/latest.json" analytics/latest.json
            cp "$tmpdir/$history_file" "$history_file"

            if [ -z "$(git status --porcelain -- analytics/latest.md analytics/latest.json "$history_file")" ]; then
              echo 'Analytics snapshot already current.'
              exit 0
            fi

            git add analytics/latest.md analytics/latest.json "$history_file"
            git commit -m "analytics: refresh automated report"
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to publish analytics after 3 synchronization attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f analytics/latest.md ]; then
            cat analytics/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Analytics report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
