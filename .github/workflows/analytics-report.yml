name: GlassesResearch Analytics Report

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/search_impact.py'
      - 'analytics/search-interventions.json'
      - '.github/workflows/analytics-report.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/analytics_report.py'
      - 'scripts/analytics_history.py'
      - 'scripts/search_opportunities.py'
      - 'scripts/search_impact.py'
      - 'analytics/search-interventions.json'
      - '.github/workflows/analytics-report.yml'
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: analytics-report
  cancel-in-progress: false

jobs:
  validate-search-impact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --quiet requests google-auth

      - name: Validate search impact tracker
        run: |
          python -m py_compile scripts/search_impact.py
          python scripts/search_impact.py --validate-only

  analytics-report:
    if: github.event_name != 'pull_request'
    needs: validate-search-impact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analytics dependencies
        run: python -m pip install --quiet requests google-auth

      - name: Generate consolidated report
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: python scripts/analytics_report.py

      - name: Build page-query search opportunities
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
        run: python scripts/search_opportunities.py

      - name: Measure evidence-led search impact
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
        run: python scripts/search_impact.py

      - name: Update long-range analytics series
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: python scripts/analytics_history.py

      - name: Publish latest snapshot, opportunities, impact, and history
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- analytics/)" ]; then
            echo 'Analytics snapshot unchanged; nothing to commit.'
            exit 0
          fi

          git config user.name 'glassesresearch-analytics-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          tmpdir="$(mktemp -d)"
          history_file="analytics/history/$(date -u +%F).json"
          mkdir -p "$tmpdir/analytics/history" "$tmpdir/analytics/series"
          cp analytics/latest.md "$tmpdir/analytics/latest.md"
          cp analytics/latest.json "$tmpdir/analytics/latest.json"
          cp analytics/search-opportunities.md "$tmpdir/analytics/search-opportunities.md"
          cp analytics/search-opportunities.json "$tmpdir/analytics/search-opportunities.json"
          cp analytics/search-impact.md "$tmpdir/analytics/search-impact.md"
          cp analytics/search-impact.json "$tmpdir/analytics/search-impact.json"
          cp "$history_file" "$tmpdir/$history_file"
          cp -a analytics/series/. "$tmpdir/analytics/series/"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p analytics/history
            cp "$tmpdir/analytics/latest.md" analytics/latest.md
            cp "$tmpdir/analytics/latest.json" analytics/latest.json
            cp "$tmpdir/analytics/search-opportunities.md" analytics/search-opportunities.md
            cp "$tmpdir/analytics/search-opportunities.json" analytics/search-opportunities.json
            cp "$tmpdir/analytics/search-impact.md" analytics/search-impact.md
            cp "$tmpdir/analytics/search-impact.json" analytics/search-impact.json
            cp "$tmpdir/$history_file" "$history_file"
            rm -rf analytics/series
            mkdir -p analytics/series
            cp -a "$tmpdir/analytics/series/." analytics/series/

            if [ -z "$(git status --porcelain -- analytics/latest.md analytics/latest.json analytics/search-opportunities.md analytics/search-opportunities.json analytics/search-impact.md analytics/search-impact.json "$history_file" analytics/series/)" ]; then
              echo 'Analytics snapshot already current.'
              exit 0
            fi

            git add analytics/latest.md analytics/latest.json analytics/search-opportunities.md analytics/search-opportunities.json analytics/search-impact.md analytics/search-impact.json "$history_file" analytics/series/
            git commit -m "analytics: refresh automated report"
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo 'Unable to publish analytics after 3 synchronization attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f analytics/latest.md ]; then
            cat analytics/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Analytics report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f analytics/search-opportunities.md ]; then
            printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat analytics/search-opportunities.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f analytics/search-impact.md ]; then
            printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat analytics/search-impact.md >> "$GITHUB_STEP_SUMMARY"
          fi
