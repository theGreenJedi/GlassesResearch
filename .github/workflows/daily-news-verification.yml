name: Daily research editorial triage

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Hourly smart-glasses knowledge intake"
      - "Daily institutional knowledge intake"
      - "Editorial triage contract"
    types: [completed]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-news-verification.yml"
      - "scripts/triage_news_reviews.py"
      - "scripts/test_triage_news_reviews.py"
      - "scripts/apply_editorial_decisions.py"
      - "scripts/test_apply_editorial_decisions.py"
      - "research/news-reviews/editorial-decisions.json"
  schedule:
    # 11:55 PM America/New_York, DST-aware backstop.
    - cron: "55 3 * * *"  # 11:55 PM EDT
    - cron: "55 4 * * *"  # 11:55 PM EST

permissions:
  contents: write

concurrency:
  group: knowledge-intake-writer
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce trigger and Eastern cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          OFFSET="$(TZ=America/New_York date +%z)"
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "55 3 * * *" ] && [ "$OFFSET" = "-0400" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "55 4 * * *" ] && [ "$OFFSET" = "-0500" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Open durable knowledge-intake branch
        if: steps.cadence.outputs.run == 'true'
        id: intake
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "glassesresearch-bot"
          git config user.email "actions@users.noreply.github.com"
          FOUND=false
          for attempt in 1 2 3 4 5; do
            if git ls-remote --exit-code --heads origin knowledge-intake >/dev/null 2>&1; then
              git fetch origin knowledge-intake main
              git checkout -B knowledge-intake origin/knowledge-intake
              git merge --no-edit origin/main
              FOUND=true
              break
            fi
            sleep 30
          done
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          if [ "$FOUND" = false ]; then
            echo "Durable knowledge-intake branch not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.cadence.outputs.run == 'true' && steps.intake.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate classification, triage, and editorial-decision contracts
        if: steps.cadence.outputs.run == 'true' && steps.intake.outputs.found == 'true'
        run: |
          python scripts/test_knowledge_flow.py
          python scripts/test_triage_news_reviews.py
          python scripts/test_apply_editorial_decisions.py
          python -m py_compile scripts/triage_news_reviews.py scripts/apply_editorial_decisions.py

      - name: Triage durable intake and apply explicit editorial decisions
        if: steps.cadence.outputs.run == 'true' && steps.intake.outputs.found == 'true'
        run: |
          python scripts/triage_news_reviews.py --lookback-days 14 --verify-reachability --timeout 8 --workers 12
          python scripts/apply_editorial_decisions.py
          cat research/news-reviews/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Persist durable editorial triage
        if: steps.cadence.outputs.run == 'true' && steps.intake.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add research/news-reviews
          if ! git diff --cached --quiet; then
            STAMP="$(TZ=America/New_York date +%Y-%m-%d-%H%M)"
            git commit -m "Persist editorial triage ${STAMP} ET"
          fi
          git push origin HEAD:knowledge-intake

      - name: Upload triage report
        if: steps.cadence.outputs.run == 'true' && steps.intake.outputs.found == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: glassesresearch-daily-editorial-triage
          path: |
            research/news-reviews/latest.md
            research/news-reviews/queue.json
          retention-days: 90

      - name: Inactive trigger counterpart
        if: steps.cadence.outputs.run == 'false'
        run: echo 'Collector did not complete successfully or this is the inactive Eastern-time schedule; no editorial triage performed.'
