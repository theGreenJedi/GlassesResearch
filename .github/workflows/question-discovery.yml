name: Discover practical questions

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/question_discovery.py'
      - 'research/question-sources.json'
      - 'research/QUESTION_DISCOVERY_PIPELINE.md'
      - 'tests/test_question_discovery.py'
      - '.github/workflows/question-discovery.yml'
  pull_request:
    paths:
      - 'scripts/question_discovery.py'
      - 'research/question-sources.json'
      - 'research/QUESTION_DISCOVERY_PIPELINE.md'
      - 'tests/test_question_discovery.py'
      - '.github/workflows/question-discovery.yml'

permissions:
  contents: write

concurrency:
  group: practical-question-discovery
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests google-auth
      - run: |
          python -m py_compile scripts/question_discovery.py
          python -m unittest discover -s tests -p 'test_question_discovery.py'

  discover:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install discovery dependencies
        run: pip install requests google-auth

      - name: Discover and reconcile questions
        env:
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          QUESTION_DISCOVERY_FEEDS: ${{ vars.QUESTION_DISCOVERY_FEEDS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/question_discovery.py

      - name: Publish registry changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- research/questions/registry.json analytics/question-discovery.json analytics/question-discovery.md; then
            echo "No question-registry change."
            exit 0
          fi
          git config user.name "glassesresearch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/questions/registry.json analytics/question-discovery.json analytics/question-discovery.md
          git commit -m "Refresh practical-question discovery"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
