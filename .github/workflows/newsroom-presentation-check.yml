name: Newsroom presentation contract

on:
  pull_request:
    paths:
      - "data/verified-changes.json"
      - "docs/RESEARCH_NEWS.md"
      - "docs/news/articles/**"
      - "docs/javascripts/research-news-newsroom.js"
      - "docs/javascripts/publication-maturity.js"
      - "docs/stylesheets/research-news-newsroom.css"
      - "docs/stylesheets/newsroom-publication-shell.css"
      - "docs/stylesheets/publication-maturity.css"
      - "mkdocs.yml"
      - "scripts/build_newsroom_state.py"
      - "scripts/verify_newsroom_state.py"
      - "scripts/feature_community_editorial.py"
      - "scripts/prepare_site.py"
      - ".github/workflows/newsroom-presentation-check.yml"
  push:
    branches: [main]
    paths:
      - "data/verified-changes.json"
      - "docs/RESEARCH_NEWS.md"
      - "docs/javascripts/research-news-newsroom.js"
      - "docs/javascripts/publication-maturity.js"
      - "docs/stylesheets/research-news-newsroom.css"
      - "docs/stylesheets/newsroom-publication-shell.css"
      - "docs/stylesheets/publication-maturity.css"
      - "mkdocs.yml"
      - "scripts/build_newsroom_state.py"
      - "scripts/verify_newsroom_state.py"
      - "scripts/feature_community_editorial.py"
      - "scripts/prepare_site.py"
      - ".github/workflows/newsroom-presentation-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile newsroom builders
        run: python -m py_compile scripts/build_newsroom_state.py scripts/verify_newsroom_state.py scripts/feature_community_editorial.py
      - name: Prove first-party editorial auto-discovery
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from build_newsroom_state import load_first_party_editorial

          now = datetime.now(timezone.utc)
          published = f"{now:%B} {now.day}, {now.year}"
          with tempfile.TemporaryDirectory() as tmp:
              article = Path(tmp) / "plumbing-proof.md"
              article.write_text(
                  '---\ndescription: "Synthetic newsroom plumbing proof."\n---\n\n'
                  '# Plumbing proof\n\n'
                  f'**Published:** {published}  \n'
                  '**Type:** GlassesResearch editorial / test  \n',
                  encoding="utf-8",
              )
              lead = load_first_party_editorial(Path(tmp))
              assert lead is not None
              assert lead["lead_mode"] == "first_party_editorial"
              assert lead["source_label"] == "GlassesResearch"
              assert lead["title"] == "Plumbing proof"
              assert lead["url"].endswith("/docs/news/articles/plumbing-proof/")
          PY
      - name: Build reader-facing newsroom state
        run: python scripts/build_newsroom_state.py --changes data/verified-changes.json --output /tmp/newsroom-state.json
      - name: Verify newsroom state contract
        run: python scripts/verify_newsroom_state.py --state /tmp/newsroom-state.json
      - name: Verify presentation consumes structured state
        run: |
          grep -q '/data/newsroom-state.json' docs/javascripts/research-news-newsroom.js
          grep -q 'newsroom-publication-shell.css' mkdocs.yml
          grep -q 'publication-maturity.css' mkdocs.yml
          grep -q 'publication-maturity.js' mkdocs.yml
          grep -q 'gr-newsroom-static-intro' docs/RESEARCH_NEWS.md
          grep -q 'data-finder-freshness' docs/COMPARISON_ENGINE.md
          if grep -q 'Implementation note:' docs/javascripts/research-news-newsroom.js; then
            echo 'Hard-coded implementation narration remains in reader presentation'
            exit 1
          fi
