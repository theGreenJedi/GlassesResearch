name: Second Life contract

on:
  pull_request:
    paths:
      - 'data/second-life.json'
      - 'data/second-life.schema.json'
      - 'docs/javascripts/second-life.js'
      - 'scripts/validate_second_life.py'
      - 'scripts/test_second_life_contract.py'
      - '.github/workflows/second-life-contract.yml'
  push:
    branches: [main]
    paths:
      - 'data/second-life.json'
      - 'data/second-life.schema.json'
      - 'docs/javascripts/second-life.js'
      - 'scripts/validate_second_life.py'
      - 'scripts/test_second_life_contract.py'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_second_life.py data/second-life.json
      - run: python scripts/test_second_life_contract.py
