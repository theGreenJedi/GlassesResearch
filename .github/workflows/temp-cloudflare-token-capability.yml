name: Temporary Cloudflare token capability probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Probe token-management read access without exposing tokens
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^Bearer[[:space:]]+//I')"
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $token")
          probe() {
            local label="$1" url="$2" out="/tmp/$1.json"
            local status
            status="$(curl --silent --show-error -o "$out" -w '%{http_code}' "${auth[@]}" "$url" || true)"
            echo "$label HTTP $status"
            jq '{success, result_count:(if (.result|type)=="array" then (.result|length) else null end), errors:[.errors[]? | {code,message}]}' "$out" 2>/dev/null || true
          }
          probe ACCOUNT_TOKENS "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens?per_page=1"
          probe ACCOUNT_PERMISSION_GROUPS "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/permission_groups"
          probe USER_TOKENS "$api/user/tokens?per_page=1"
          probe USER_PERMISSION_GROUPS "$api/user/tokens/permission_groups"
