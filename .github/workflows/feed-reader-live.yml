name: Feed reader live smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical reader contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://glassesresearch.org/feed.xml' docs/FEEDS.md
          grep -Fq 'https://glassesresearch.org/data/wire-feed.xml' docs/FEEDS.md
          grep -Fq 'https://glassesresearch.org/feed.json' docs/FEEDS.md
          grep -Fq 'https://glassesresearch.org/data/wire-feed.json' docs/FEEDS.md
          grep -Fq 'https://feedly.com/' docs/FEEDS.md
          grep -Fq 'https://www.inoreader.com/feed/' docs/FEEDS.md
          grep -Fq 'normalizeReaderLinks' docs/javascripts/feed-choice.js
          grep -Fq 'Copy RSS URL' docs/javascripts/feed-choice.js
          echo 'Feed-reader contract passed.'

  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 16); do
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://glassesresearch.org/deployment.json?feed-smoke=${GITHUB_SHA}-${attempt}" -o /tmp/deployment.json \
              && python -c "import json,os; assert json.load(open('/tmp/deployment.json')).get('sha') == os.environ['GITHUB_SHA']"; then
              exit 0
            fi
            sleep 15
          done
          echo 'Production never served expected SHA.' >&2
          exit 1

      - name: Verify live GlassesResearch feed surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/feed.xml -o /tmp/verified.xml
          curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/data/wire-feed.xml -o /tmp/wire.xml
          curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/feed.json -o /tmp/verified.json
          curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/data/wire-feed.json -o /tmp/wire.json
          curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/docs/FEEDS/ -o /tmp/feeds.html
          python - <<'PY'
          import json
          from xml.etree import ElementTree as ET

          for path in ('/tmp/verified.xml','/tmp/wire.xml'):
              root=ET.parse(path).getroot()
              assert root.tag == 'rss'
              channel=root.find('channel')
              assert channel is not None and channel.findtext('title') and channel.findall('item')

          for path in ('/tmp/verified.json','/tmp/wire.json'):
              data=json.load(open(path))
              assert data.get('version')
              assert data.get('title')
              assert isinstance(data.get('items'), list)
          PY
          grep -Fq 'https://glassesresearch.org/feed.xml' /tmp/feeds.html
          grep -Fq 'https://glassesresearch.org/data/wire-feed.xml' /tmp/feeds.html
          grep -Fq 'https://feedly.com/' /tmp/feeds.html
          grep -Fq 'https://www.inoreader.com/feed/' /tmp/feeds.html
          echo 'Live GlassesResearch RSS, JSON, and feed-page contract passed.'
