name: Feed reader live smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical reader contract
        shell: bash
        run: |
          set -euo pipefail
          verified='https://glassesresearch.org/feed.xml'
          wire='https://glassesresearch.org/data/wire-feed.xml'
          feedly_prefix='https://feedly.com/i/subscription/feed%2F'
          inoreader_prefix='https://www.inoreader.com/?add_feed='
          grep -Fq "${feedly_prefix}https%3A%2F%2Fglassesresearch.org%2Ffeed.xml" docs/FEEDS.md
          grep -Fq "${feedly_prefix}https%3A%2F%2Fglassesresearch.org%2Fdata%2Fwire-feed.xml" docs/FEEDS.md
          grep -Fq "${inoreader_prefix}https%3A%2F%2Fglassesresearch.org%2Ffeed.xml" docs/FEEDS.md
          grep -Fq "${inoreader_prefix}https%3A%2F%2Fglassesresearch.org%2Fdata%2Fwire-feed.xml" docs/FEEDS.md
          grep -Fq 'const INOREADER_PREFIX = "https://www.inoreader.com/?add_feed=";' docs/javascripts/feed-choice.js
          echo 'Feed-reader source contract passed.'

  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 16); do
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://glassesresearch.org/deployment.json?feed-smoke=${GITHUB_SHA}-${attempt}" -o /tmp/deployment.json \
              && python -c "import json,os; assert json.load(open('/tmp/deployment.json')).get('sha') == os.environ['GITHUB_SHA']"; then
              exit 0
            fi
            sleep 15
          done
          echo 'Production never served expected SHA.' >&2
          exit 1

      - name: Verify live feeds and reader handoffs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/feed.xml -o /tmp/verified.xml
          curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/data/wire-feed.xml -o /tmp/wire.xml
          curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/docs/FEEDS/ -o /tmp/feeds.html
          python - <<'PY'
          from xml.etree import ElementTree as ET
          for path in ('/tmp/verified.xml','/tmp/wire.xml'):
              root=ET.parse(path).getroot()
              assert root.tag == 'rss'
              channel=root.find('channel')
              assert channel is not None and channel.findtext('title') and channel.findall('item')
          PY
          grep -Fq 'https://www.inoreader.com/?add_feed=https%3A%2F%2Fglassesresearch.org%2Ffeed.xml' /tmp/feeds.html
          grep -Fq 'https://www.inoreader.com/?add_feed=https%3A%2F%2Fglassesresearch.org%2Fdata%2Fwire-feed.xml' /tmp/feeds.html

          check_handoff() {
            label="$1"; url="$2"; body="/tmp/${label}.html"
            code="$(curl --silent --show-error --location --max-time 25 -A 'Mozilla/5.0 GlassesResearch feed-reader smoke test' -o "$body" -w '%{http_code}' "$url")"
            case "$code" in 2*|3*) ;; *) echo "$label returned HTTP $code" >&2; exit 1;; esac
            if grep -Eqi 'feed not found|wrong feed url|dead feed|(^|>)\s*(page )?not found\s*(<|$)' "$body"; then
              echo "$label reader rejected the feed" >&2
              exit 1
            fi
          }

          check_handoff feedly-verified 'https://feedly.com/i/subscription/feed%2Fhttps%3A%2F%2Fglassesresearch.org%2Ffeed.xml'
          check_handoff feedly-wire 'https://feedly.com/i/subscription/feed%2Fhttps%3A%2F%2Fglassesresearch.org%2Fdata%2Fwire-feed.xml'
          check_handoff inoreader-verified 'https://www.inoreader.com/?add_feed=https%3A%2F%2Fglassesresearch.org%2Ffeed.xml'
          check_handoff inoreader-wire 'https://www.inoreader.com/?add_feed=https%3A%2F%2Fglassesresearch.org%2Fdata%2Fwire-feed.xml'
          echo 'Live RSS and reader handoffs passed.'
