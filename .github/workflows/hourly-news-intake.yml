name: Hourly smart-glasses news intake

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hourly-smart-glasses-news-intake
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect recent smart-glasses news
        run: python scripts/collect_daily_news.py

      - name: Detect new news candidates
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- research/news-candidates)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve hourly news inbox
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: America/New_York
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date +%Y-%m-%d-%H%M)"
          BRANCH="news-intake-${STAMP}-${GITHUB_RUN_ID}"
          git config user.name "glassesresearch-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add research/news-candidates
          git commit -m "Collect hourly smart-glasses news ${STAMP} ET"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Hourly smart-glasses news intake — ${STAMP} ET" \
            --body "Automated high-recall news inbox. Discovery is not publication. Deduplicate underlying events, privilege primary sources, verify factual claims, and publish only evidence-backed developments. Verified publication can then be sent immediately to subscribers who selected as-verified delivery through the alerts Worker."

      - name: No new news
        if: steps.changes.outputs.changed == 'false'
        run: echo "No new news candidates this hour."
