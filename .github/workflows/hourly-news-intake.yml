name: Hourly smart-glasses knowledge intake

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-intake-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Open durable knowledge-intake branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "glassesresearch-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin knowledge-intake >/dev/null 2>&1; then
            git fetch origin knowledge-intake
            git checkout -B knowledge-intake origin/knowledge-intake
            git merge --no-edit origin/main
          else
            git checkout -B knowledge-intake origin/main
          fi

      - name: Validate classifier
        run: python scripts/test_knowledge_flow.py

      - name: Preserve previous same-day snapshot
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          STAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          for EXT in json md; do
            SRC="research/news-candidates/${DATE}.${EXT}"
            if [ -f "$SRC" ]; then
              mv "$SRC" "research/news-candidates/${STAMP}.${EXT}"
            fi
          done

      - name: Discover, classify, triage, and route recent candidates
        run: python scripts/collect_daily_news.py

      - name: Persist durable intake queue
        shell: bash
        run: |
          set -euo pipefail
          git add research/news-candidates
          if ! git diff --cached --quiet; then
            STAMP="$(TZ=America/New_York date +%Y-%m-%d-%H%M)"
            git commit -m "Persist classified smart-glasses intake ${STAMP} ET"
          fi
          git push origin HEAD:knowledge-intake

          {
            echo "### Knowledge intake"
            echo ""
            echo "The durable queue is stored on the \`knowledge-intake\` branch."
            echo "Collection is not publication; candidates carry relationship, type, triage, and routing metadata before editorial review."
          } >> "$GITHUB_STEP_SUMMARY"
