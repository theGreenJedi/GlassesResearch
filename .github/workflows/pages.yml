name: Deploy documentation site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Audit repository links and preservation records
        run: python scripts/audit_repository.py --external-output build/external-links.txt

      - name: Validate canonical device database
        run: python scripts/build_device_database.py --validate-only

      - name: Validate comparison engine
        run: python scripts/build_comparison_engine.py --validate-only

      - name: Validate artifact preservation archive
        run: python scripts/validate_artifact_archive.py

      - name: Validate evidence corpus
        run: python scripts/validate_evidence_corpus.py

      - name: Validate living industry timeline
        run: python scripts/validate_timeline.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Stage repository documentation
        run: python scripts/prepare_site.py

      - name: Audit public editorial content
        run: python scripts/audit_public_editorial.py

      - name: Build site
        run: mkdocs build --strict

      - name: Verify built-site internal links and fragments
        run: python scripts/verify_built_site_links.py

      - name: Verify built JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f -name '*.js' -print0)

      - name: Verify search discoverability signals
        run: python scripts/verify_discoverability.py

      - name: Verify built research endpoints
        shell: bash
        run: |
          set -euo pipefail
          test -s site/timeline/events.json
          test -s site/timeline/auto-events.json
          test -s site/evidence/resources.json
          test -s site/data/comparisons.json
          test -s site/data/devices.json
          test -s site/docs/COMPARISON_ENGINE/index.html
          test -s site/docs/START_BY_NEED/index.html
          test -s site/docs/RESEARCH_STANDARDS/index.html
          test -s site/docs/CONTRIBUTORS/index.html
          test -s site/docs/PRESERVATION/index.html
          test -s site/resources/COMMUNITY_AND_DEVELOPMENT/index.html
          test -s site/models/AnkoCameraGlasses/index.html
          test -s site/models/RETAIL_REBRANDS/index.html
          test -s site/lineages/index.html
          test -s site/docs/javascripts/comparison-engine.js
          grep -Fq 'TL-0001' site/timeline/events.json
          grep -Fq 'EV-0001' site/evidence/resources.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('site/data/devices.json').read_text(encoding='utf-8'))
          records = payload.get('records', [])
          count = payload.get('record_count')
          assert isinstance(count, int) and count > 0, f'invalid record_count: {count!r}'
          assert count == len(records), f'record_count {count} != parsed records {len(records)}'
          ids = [record.get('id') for record in records]
          assert len(ids) == len(set(ids)), 'duplicate GLS IDs in built device database'
          print(f'Built catalog verified dynamically: {count} devices')
          PY
          grep -Fq 'Google Glass' site/lineages/index.html
          grep -Fq 'Vuzix' site/lineages/index.html
          grep -Fq 'industry-timeline-app' site/docs/INDUSTRY_TIMELINE/index.html
          grep -Fq 'comparison-engine-app' site/docs/COMPARISON_ENGINE/index.html
          grep -Fq 'models available for comparison' site/docs/javascripts/comparison-engine.js
          grep -Fq 'https://www.reddit.com/r/SmartGlasses/' site/resources/COMMUNITY_AND_DEVELOPMENT/index.html
          grep -Fq 'https://github.com/Mentra-Community' site/resources/COMMUNITY_AND_DEVELOPMENT/index.html
          grep -Fq 'https://xdaforums.com/' site/resources/COMMUNITY_AND_DEVELOPMENT/index.html
          grep -Fq 'HeyCyan' site/models/AnkoCameraGlasses/index.html
          grep -Fq 'Retail Rebrands' site/models/RETAIL_REBRANDS/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload external-link inventory
        uses: actions/upload-artifact@v4
        with:
          name: external-link-inventory
          path: build/external-links.txt

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site data
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/robots.txt -o /tmp/robots.txt \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/sitemap.xml -o /tmp/sitemap.xml \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/timeline/events.json -o /tmp/timeline.json \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/data/comparisons.json -o /tmp/comparisons.json \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/data/devices.json -o /tmp/devices.json \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/docs/javascripts/comparison-engine.js -o /tmp/comparison-engine.js \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/resources/COMMUNITY_AND_DEVELOPMENT/ -o /tmp/community.html \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/models/AnkoCameraGlasses/ -o /tmp/anko.html \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/models/RETAIL_REBRANDS/ -o /tmp/rebrands.html \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/lineages/ -o /tmp/lineages.html \
              && grep -Fq 'Sitemap: https://glassesresearch.org/sitemap.xml' /tmp/robots.txt \
              && grep -Fq 'https://glassesresearch.org/' /tmp/sitemap.xml \
              && grep -Fq 'TL-0001' /tmp/timeline.json \
              && grep -Fq 'record_count' /tmp/comparisons.json \
              && python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/devices.json').read_text(encoding='utf-8'))
          records = payload.get('records', [])
          count = payload.get('record_count')
          assert isinstance(count, int) and count > 0, f'invalid live record_count: {count!r}'
          assert count == len(records), f'live record_count {count} != records {len(records)}'
          print(f'Live catalog verified dynamically: {count} devices')
          PY
              && grep -Fq 'models available for comparison' /tmp/comparison-engine.js \
              && grep -Fq 'https://www.reddit.com/r/SmartGlasses/' /tmp/community.html \
              && grep -Fq 'https://github.com/Mentra-Community' /tmp/community.html \
              && grep -Fq 'https://xdaforums.com/' /tmp/community.html \
              && grep -Fq 'HeyCyan' /tmp/anko.html \
              && grep -Fq 'Retail Rebrands' /tmp/rebrands.html \
              && grep -Fq 'Google Glass' /tmp/lineages.html \
              && grep -Fq 'Vuzix' /tmp/lineages.html; then
              echo 'Live site verified: dynamic device catalog, Google Glass/Vuzix lineages, comparison data, and ecosystem-wide community links are present.'
              exit 0
            fi
            echo "Attempt ${attempt}/5 failed; waiting for Pages/DNS propagation..."
            sleep 15
          done
          echo 'Live endpoint verification failed.' >&2
          exit 1
