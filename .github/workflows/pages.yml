name: Deploy documentation site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate canonical device database
        run: python scripts/build_device_database.py --validate-only

      - name: Validate comparison engine
        run: python scripts/build_comparison_engine.py --validate-only

      - name: Validate artifact preservation archive
        run: python scripts/validate_artifact_archive.py

      - name: Validate evidence corpus
        run: python scripts/validate_evidence_corpus.py

      - name: Validate living industry timeline
        run: python scripts/validate_timeline.py

      - name: Validate news promotion destinations
        run: python scripts/verify_news_promotion.py --self-test

      - name: Validate ecosystem relationships
        run: python scripts/validate_ecosystem_relations.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Stage repository documentation
        run: python scripts/prepare_site.py

      - name: Verify open dataset release
        run: python scripts/verify_open_dataset.py --site-root .site-src

      - name: Audit repository links and preservation records
        run: python scripts/audit_repository.py --external-output build/external-links.txt

      - name: Audit public editorial content
        run: python scripts/audit_public_editorial.py

      - name: Build site
        run: mkdocs build --strict

      - name: Stamp deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "sha": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_number": os.environ["GITHUB_RUN_NUMBER"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
          }
          Path("site/deployment.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          Path("site/deployment.txt").write_text(payload["sha"] + "\n", encoding="utf-8")
          print(f"Stamped deployment provenance for {payload['sha']}")
          PY

      - name: Reconcile sitemap with deployable artifact
        run: python scripts/reconcile_sitemap.py --site-dir site

      - name: Verify built-site internal links and fragments
        run: python scripts/verify_built_site_links.py

      - name: Verify every public page has an intentional path
        run: python scripts/verify_public_reachability.py

      - name: Verify built JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f -name '*.js' -print0)

      - name: Verify search discoverability signals
        run: python scripts/verify_discoverability.py

      - name: Verify built research endpoints
        shell: bash
        run: |
          set -euo pipefail
          test -s site/deployment.json
          test -s site/deployment.txt
          test -s site/timeline/events.json
          test -s site/timeline/auto-events.json
          test -s site/evidence/resources.json
          test -s site/data/comparisons.json
          test -s site/data/devices.json
          test -s site/data/public/models.json
          test -s site/data/public/models.csv
          test -s site/data/public/lineages.json
          test -s site/data/public/relationships.json
          test -s site/data/public/manifest.json
          test -s site/data/public/SHA256SUMS.txt
          test -s site/data/public/schema.json
          test -s site/data/public/models/gls-0001.json
          test -s site/data/public/models/gls-0146.json
          test -s site/data/citations/index.json
          test -s site/data/citations/gls-0039.bib
          test -s site/data/citations/gls-0039.json
          test -s site/javascripts/glassesresearch-model-card.js
          test -s site/dataset/index.html
          test -s site/docs/REFERENCE_DESK/index.html
          test -s site/docs/EMBED_GLASSESRESEARCH/index.html
          test -s site/docs/COMPARISON_ENGINE/index.html
          test -s site/docs/START_BY_NEED/index.html
          test -s site/docs/RESEARCH_STANDARDS/index.html
          test -s site/docs/CONTRIBUTORS/index.html
          test -s site/docs/PRESERVATION/index.html
          test -s site/docs/TOOLS/index.html
          test -s site/resources/COMMUNITY_AND_DEVELOPMENT/index.html
          test -s site/models/AnkoCameraGlasses/index.html
          test -s site/models/RETAIL_REBRANDS/index.html
          test -s site/models/catalog/gls-0001/index.html
          test -s site/models/catalog/gls-0146/index.html
          test -s site/guides/index.html
          test -s site/guides/prescription-smart-glasses/index.html
          test -s site/lineages/index.html
          test -s site/docs/javascripts/comparison-engine.js
          grep -Fq 'TL-0001' site/timeline/events.json
          grep -Fq 'EV-0001' site/evidence/resources.json
          python -c "import json, os; p=json.load(open('site/deployment.json')); assert p['sha']==os.environ['GITHUB_SHA']; print(f'Built provenance verified: {p[\"sha\"]}')"
          python -c "import json; p=json.load(open('site/data/devices.json', encoding='utf-8')); r=p.get('records', []); c=p.get('record_count'); assert isinstance(c, int) and c > 0; assert c == len(r); ids=[x.get('id') for x in r]; assert len(ids) == len(set(ids)); print(f'Built catalog verified dynamically: {c} devices')"
          python -c "import json; d=json.load(open('site/data/devices.json')); p=json.load(open('site/data/public/models.json')); l=json.load(open('site/data/public/lineages.json')); r=json.load(open('site/data/public/relationships.json')); m=json.load(open('site/data/public/manifest.json')); assert p['record_count']==d['record_count']; assert len(p['records'])==p['record_count']; assert m['record_count']==p['record_count']; assert m['lineage_model_count']==l['model_count']; assert m['relationship_count']==r['relationship_count']; assert m['version'].startswith('GRD-'); print(f'Open dataset built: {m[\"version\"]}, {m[\"record_count\"]} models, {m[\"family_count\"]} families')"
          python -c "import json; d=json.load(open('site/data/devices.json')); c=json.load(open('site/data/citations/index.json')); assert c['record_count']==d['record_count']; assert any(r['id']=='GLS-0039' for r in c['records']); print(f'Citation distribution verified dynamically: {c[\"record_count\"]} models')"
          expected="$(python -c "import json; print(json.load(open('site/data/devices.json'))['record_count'])")"
          version="$(python -c "import json; print(json.load(open('site/data/public/manifest.json'))['version'].lower())")"
          test -s "site/data/public/releases/${version}/manifest.json"
          test -s "site/data/public/releases/${version}/models.json"
          test "$(find site/data/public/models -maxdepth 1 -name 'gls-*.json' | wc -l)" -eq "$expected"
          test "$(find site/data/citations -maxdepth 1 -name 'gls-*.json' | wc -l)" -eq "$expected"
          test "$(find site/data/citations -maxdepth 1 -name 'gls-*.bib' | wc -l)" -eq "$expected"
          test "$(find site/models/catalog -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq "$expected"
          test "$(find site/guides -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 12
          grep -Fq 'verified price ceilings, and Report Card minimum scores' site/docs/TOOLS/index.html
          grep -Fq 'Open Smart-Glasses Dataset' site/docs/TOOLS/index.html
          grep -Fq 'GlassesResearch Open Smart-Glasses Dataset' site/dataset/index.html
          grep -Fq 'application/ld+json' site/dataset/index.html
          grep -Fq '"@type":"Dataset"' site/dataset/index.html
          grep -Fq 'Reference desk' site/docs/REFERENCE_DESK/index.html
          grep -Fq 'Embed a GlassesResearch model card' site/docs/EMBED_GLASSESRESEARCH/index.html
          grep -Fq 'cookie-free' site/javascripts/glassesresearch-model-card.js
          grep -Fq 'Google Glass' site/lineages/index.html
          grep -Fq 'Vuzix' site/lineages/index.html
          grep -Fq 'industry-timeline-app' site/docs/INDUSTRY_TIMELINE/index.html
          grep -Fq 'comparison-engine-app' site/docs/COMPARISON_ENGINE/index.html
          grep -Fq 'models available for comparison' site/docs/javascripts/comparison-engine.js
          grep -Fq 'https://www.reddit.com/r/SmartGlasses/' site/resources/COMMUNITY_AND_DEVELOPMENT/index.html
          grep -Fq 'https://github.com/Mentra-Community' site/resources/COMMUNITY_AND_DEVELOPMENT/index.html
          grep -Fq 'https://xdaforums.com/' site/resources/COMMUNITY_AND_DEVELOPMENT/index.html
          grep -Fq 'HeyCyan' site/models/AnkoCameraGlasses/index.html
          grep -Fq 'Retail Rebrands' site/models/RETAIL_REBRANDS/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload external-link inventory
        uses: actions/upload-artifact@v4
        with:
          name: external-link-inventory
          path: build/external-links.txt

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployment provenance and features
        shell: bash
        run: |
          set -euo pipefail
          base='https://glassesresearch.org'
          for attempt in $(seq 1 12); do
            bust="deploy=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}"
            curl_live() {
              curl --fail --silent --show-error --location --max-time 20 \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                "${base}${1}?${bust}" -o "$2"
            }

            if curl_live /deployment.json /tmp/deployment.json \
              && curl_live /robots.txt /tmp/robots.txt \
              && curl_live /sitemap.xml /tmp/sitemap.xml \
              && curl_live /timeline/events.json /tmp/timeline.json \
              && curl_live /data/comparisons.json /tmp/comparisons.json \
              && curl_live /data/devices.json /tmp/devices.json \
              && curl_live /data/public/models.json /tmp/public-models.json \
              && curl_live /data/public/models.csv /tmp/public-models.csv \
              && curl_live /data/public/lineages.json /tmp/lineages.json \
              && curl_live /data/public/relationships.json /tmp/relationships.json \
              && curl_live /data/public/manifest.json /tmp/dataset-manifest.json \
              && curl_live /data/public/SHA256SUMS.txt /tmp/dataset-sums.txt \
              && curl_live /dataset/ /tmp/dataset.html \
              && curl_live /data/citations/index.json /tmp/citations.json \
              && curl_live /data/citations/gls-0039.bib /tmp/gls-0039.bib \
              && curl_live /javascripts/glassesresearch-model-card.js /tmp/model-card.js \
              && curl_live /docs/TOOLS/ /tmp/tools.html \
              && curl_live /docs/REFERENCE_DESK/ /tmp/reference-desk.html \
              && curl_live /docs/EMBED_GLASSESRESEARCH/ /tmp/embed.html \
              && curl_live /docs/javascripts/comparison-engine.js /tmp/comparison-engine.js \
              && curl_live /resources/COMMUNITY_AND_DEVELOPMENT/ /tmp/community.html \
              && curl_live /models/AnkoCameraGlasses/ /tmp/anko.html \
              && curl_live /models/RETAIL_REBRANDS/ /tmp/rebrands.html \
              && curl_live /lineages/ /tmp/lineages.html; then
              version="$(python -c "import json; print(json.load(open('/tmp/dataset-manifest.json'))['version'].lower())")"
              if curl_live "/data/public/releases/${version}/manifest.json" /tmp/dataset-release-manifest.json \
                && python -c "import json, os; p=json.load(open('/tmp/deployment.json')); expected=os.environ['GITHUB_SHA']; actual=p.get('sha'); assert actual==expected, f'stale production: expected {expected}, got {actual}'; print(f'Live deployment SHA verified: {actual}')" \
                && grep -Fq 'Sitemap: https://glassesresearch.org/sitemap.xml' /tmp/robots.txt \
                && grep -Fq 'https://glassesresearch.org/' /tmp/sitemap.xml \
                && grep -Fq 'TL-0001' /tmp/timeline.json \
                && grep -Fq 'record_count' /tmp/comparisons.json \
                && python -c "import json; p=json.load(open('/tmp/devices.json', encoding='utf-8')); r=p.get('records', []); c=p.get('record_count'); assert isinstance(c, int) and c > 0; assert c == len(r); print(f'Live catalog verified dynamically: {c} devices')" \
                && python -c "import json; d=json.load(open('/tmp/devices.json')); p=json.load(open('/tmp/public-models.json')); l=json.load(open('/tmp/lineages.json')); r=json.load(open('/tmp/relationships.json')); m=json.load(open('/tmp/dataset-manifest.json')); rm=json.load(open('/tmp/dataset-release-manifest.json')); assert p['record_count']==d['record_count']==m['record_count']; assert m['lineage_model_count']==l['model_count']; assert m['relationship_count']==r['relationship_count']; assert rm['version']==m['version']; print(f'Live open dataset verified: {m[\"version\"]}, {m[\"record_count\"]} models')" \
                && python -c "import json; d=json.load(open('/tmp/devices.json')); c=json.load(open('/tmp/citations.json')); assert c['record_count']==d['record_count']; assert any(r['id']=='GLS-0039' for r in c['records']); print(f'Live citation distribution verified: {c[\"record_count\"]} models')" \
                && grep -Fq 'id,maker,model,era,state,type,access' /tmp/public-models.csv \
                && grep -Fq 'models.json' /tmp/dataset-sums.txt \
                && grep -Fq 'GlassesResearch Open Smart-Glasses Dataset' /tmp/dataset.html \
                && grep -Fq '"@type":"Dataset"' /tmp/dataset.html \
                && grep -Fq 'verified price ceilings, and Report Card minimum scores' /tmp/tools.html \
                && grep -Fq 'Open Smart-Glasses Dataset' /tmp/tools.html \
                && grep -Fq 'Reference desk' /tmp/reference-desk.html \
                && grep -Fq 'Embed a GlassesResearch model card' /tmp/embed.html \
                && grep -Fq 'GLS-0039' /tmp/gls-0039.bib \
                && grep -Fq 'cookie-free' /tmp/model-card.js \
                && grep -Fq 'models available for comparison' /tmp/comparison-engine.js \
                && grep -Fq 'https://www.reddit.com/r/SmartGlasses/' /tmp/community.html \
                && grep -Fq 'https://github.com/Mentra-Community' /tmp/community.html \
                && grep -Fq 'https://xdaforums.com/' /tmp/community.html \
                && grep -Fq 'HeyCyan' /tmp/anko.html \
                && grep -Fq 'Retail Rebrands' /tmp/rebrands.html \
                && grep -Fq 'Google Glass' /tmp/lineages.html \
                && grep -Fq 'Vuzix' /tmp/lineages.html; then
                echo "Live site verified at exact deployment SHA ${GITHUB_SHA}; deployment provenance and open dataset smoke tests passed."
                exit 0
              fi
            fi
            echo "Attempt ${attempt}/12 did not yet match deployment ${GITHUB_SHA}."
            sleep 15
          done
          echo "Live deployment verification failed: production did not prove SHA ${GITHUB_SHA} with required feature surfaces." >&2
          exit 1
