name: Deploy documentation site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Audit repository links and preservation records
        run: python scripts/audit_repository.py --external-output build/external-links.txt

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Stage repository documentation
        run: python scripts/prepare_site.py

      - name: Build site
        run: mkdocs build --strict

      - name: Verify search discoverability signals
        run: python scripts/verify_discoverability.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload external-link inventory
        uses: actions/upload-artifact@v4
        with:
          name: external-link-inventory
          path: build/external-links.txt

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live search endpoints
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/robots.txt -o /tmp/robots.txt \
              && curl --fail --silent --show-error --location --max-time 20 https://glassesresearch.org/sitemap.xml -o /tmp/sitemap.xml \
              && grep -Fq 'Sitemap: https://glassesresearch.org/sitemap.xml' /tmp/robots.txt \
              && grep -Fq 'https://glassesresearch.org/' /tmp/sitemap.xml; then
              echo 'Live discoverability endpoints verified.'
              exit 0
            fi
            echo "Attempt ${attempt}/5 failed; waiting for Pages/DNS propagation..."
            sleep 15
          done
          echo 'Live discoverability verification failed.' >&2
          exit 1
