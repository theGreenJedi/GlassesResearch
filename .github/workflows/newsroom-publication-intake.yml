name: Pull approved newsroom publication packages

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/newsroom_publication_intake.py'
      - 'scripts/newsroom_news_actuator.py'
      - 'scripts/newsroom_story_update_actuator.py'
      - 'scripts/newsroom_route_actuator.py'
      - 'scripts/model_proposal_intake.py'
      - 'scripts/model_proposal_actuator.py'
      - '.github/workflows/newsroom-publication-intake.yml'
      - 'research/newsroom-packages/**'
      - 'research/newsroom-actions/**'
      - 'research/newsroom-dossiers/**'
      - 'research/newsroom-evidence/**'
      - 'research/model-proposals/**'
      - 'research/model-actions/**'
      - 'research/news-reviews/**'
      - 'docs/RESEARCH_NEWS.md'
      - 'docs/news/articles/**'
      - 'data/verified-changes.json'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: newsroom-publication-intake
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test newsroom intake
        run: python scripts/newsroom_publication_intake.py --self-test
      - name: Self-test news-only canonical actuator
        run: python scripts/newsroom_news_actuator.py --self-test
      - name: Self-test news story-update scope
        run: python scripts/newsroom_story_update_actuator.py --self-test
      - name: Self-test non-news route dispatcher
        run: python scripts/newsroom_route_actuator.py --self-test
      - name: Self-test model proposal intake
        run: python scripts/model_proposal_intake.py --input /dev/null --self-test
      - name: Self-test model proposal actuator
        run: python scripts/model_proposal_actuator.py --self-test

  intake:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      BRANCH: automation/newsroom-publication-intake
      QUEUE_URL: https://glassesresearch.org/api/newsroom/publication-queue
      MODEL_PROPOSAL_QUEUE_URL: https://glassesresearch.org/api/newsroom/model-proposals
      OIDC_AUDIENCE: glassesresearch-newsroom-publication
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare persistent intake branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git fetch origin "${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
            git merge --no-edit origin/main
          else
            git checkout -b "${BRANCH}" origin/main
          fi

      - name: Mint short-lived GitHub OIDC identity and pull draft-authorized queues
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${oidc_json}")"
          test -n "${oidc_token}"
          echo "::add-mask::${oidc_token}"
          curl --fail --silent --show-error --location --max-time 30 \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${oidc_token}" \
            "${QUEUE_URL}" -o /tmp/newsroom-publication-queue.json
          curl --fail --silent --show-error --location --max-time 30 \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer ${oidc_token}" \
            "${MODEL_PROPOSAL_QUEUE_URL}" -o /tmp/model-proposal-queue.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.newsroom_publication_intake import ingest as ingest_newsroom
          from scripts.model_proposal_intake import ingest as ingest_models

          newsroom_path = Path('/tmp/newsroom-publication-queue.json')
          newsroom_payload = json.loads(newsroom_path.read_text(encoding='utf-8'))
          raw_packages = newsroom_payload.get('packages')
          if isinstance(raw_packages, list):
              kept_packages = []
              dropped_routes = 0
              review_destinations = {
                  'news.publish',
                  'news.update_story',
                  'catalog.update',
                  'lineage.update',
                  'report_card.evidence',
                  'finder.update',
                  'release_tracker.update',
              }
              for package in raw_packages:
                  if not isinstance(package, dict):
                      continue
                  routes = package.get('routes')
                  if not isinstance(routes, list):
                      continue
                  kept_routes = [
                      route for route in routes
                      if isinstance(route, dict) and route.get('destination') in review_destinations
                  ]
                  dropped_routes += len(routes) - len(kept_routes)
                  if kept_routes:
                      kept_packages.append({**package, 'routes': kept_routes})
              newsroom_payload = {**newsroom_payload, 'packages': kept_packages}
              if dropped_routes:
                  print(f"Repository draft guard kept {dropped_routes} research-only newsroom route(s) internal.")
          newsroom_created = ingest_newsroom(
              newsroom_payload,
              Path('research/newsroom-packages'),
              os.environ['QUEUE_URL'],
          )
          if newsroom_created:
              print(f"Ingested {len(newsroom_created)} newsroom draft package(s): {', '.join(newsroom_created)}")
          else:
              print('No new newsroom draft packages.')

          model_path = Path('/tmp/model-proposal-queue.json')
          model_payload = json.loads(model_path.read_text(encoding='utf-8'))
          raw_proposals = model_payload.get('proposals')
          if isinstance(raw_proposals, list):
              kept = []
              dropped = 0
              automatic_kinds = {'catalog_admission', 'identity_correction', 'lineage_change', 'evidence_update'}
              for item in raw_proposals:
                  proposal = item.get('proposal') if isinstance(item, dict) else None
                  if not isinstance(proposal, dict):
                      dropped += 1
                      continue
                  kind = proposal.get('proposal_kind')
                  evidence = proposal.get('evidence')
                  consequences = proposal.get('consequences')
                  if kind == 'escalation':
                      draftable = isinstance(evidence, list) and len(evidence) > 0
                  else:
                      draftable = (
                          kind in automatic_kinds
                          and isinstance(evidence, list) and len(evidence) > 0
                          and isinstance(consequences, list) and len(consequences) > 0
                      )
                  if draftable:
                      kept.append(item)
                  else:
                      dropped += 1
              model_payload = {**model_payload, 'proposals': kept}
              if dropped:
                  print(f"Repository draft guard dropped {dropped} low-signal model proposal(s).")
          model_created = ingest_models(
              model_payload,
              Path('research/model-proposals'),
              os.environ['MODEL_PROPOSAL_QUEUE_URL'],
          )
          if model_created:
              print(f"Ingested {len(model_created)} model draft proposal(s): {', '.join(model_created)}")
          else:
              print('No new model draft proposals.')
          PY

      - name: Compile safe news-only packages into canonical draft edits
        run: python scripts/newsroom_news_actuator.py --all

      - name: Compile safe news story updates into dated canonical draft edits
        run: python scripts/newsroom_story_update_actuator.py --all

      - name: Materialize all authorized non-news routes
        run: python scripts/newsroom_route_actuator.py --all

      - name: Materialize authorized model proposals as draft actions
        run: python scripts/model_proposal_actuator.py --all

      - name: Validate any generated publication surfaces
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verified_changes.py
          python scripts/verify_news_promotion.py --self-test

      - name: Commit intake and safe draft actions
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No new draft packages or model actions.'
            exit 0
          fi
          git add -A -- research/newsroom-packages research/news-reviews docs/RESEARCH_NEWS.md docs/news/articles data/verified-changes.json
          for path in research/newsroom-actions research/newsroom-dossiers research/newsroom-evidence research/model-proposals research/model-actions; do
            if [[ -e "${path}" ]]; then
              git add -A -- "${path}"
            fi
          done
          git commit -m 'Prepare machine-researched intelligence draft'
          git push --set-upstream origin "${BRANCH}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Open or update draft intelligence PR
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "Updated existing intelligence intake PR #${existing}."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --draft \
            --title 'Review machine-prepared intelligence changes' \
            --body $'An Editorial approval authorizes the machines to investigate and prepare a repository draft; it does not authorize a canonical merge. Ordinary evidence-backed News and Models findings flow here without intermediate operator clicks. Contradictory/escalated model cases still require explicit exception approval before they can enter this draft.\n\nThe machine handoff uses a short-lived GitHub OIDC token bound to this repository/workflow. No long-lived shared secret and no Worker GitHub credential are used.\n\nNews publish/update packages may compile into dated Research & News / article / GRE / review changes. Non-news newsroom routes become bounded repository actions. Model-investigator proposals become deterministic action packets: exact existing GLS targets are required for identity/evidence/lineage work, new catalog admissions remain visible candidates requiring canonical GLS allocation, and unresolved identity is blocked rather than guessed.\n\nThis PR is the normal human canonical gate. Nothing should be treated as published or canonical until its diff is reviewed and merged.'
