name: Evidence enrichment architecture

on:
  pull_request:
    paths:
      - 'research/EVIDENCE_ENRICHMENT_ARCHITECTURE.md'
      - 'research/evidence-claims.schema.json'
      - 'research/claims/**'
      - 'research/dossiers/**'
      - 'research/model-evidence/**'
      - 'tests/fixtures/evidence-claims/**'
      - 'research/KNOWLEDGE_FLOW.md'
      - 'research/REPORT_CARD_PIPELINE.md'
      - 'scripts/build_model_evidence_index.py'
      - 'scripts/validate_evidence_architecture.py'
      - '.github/workflows/evidence-architecture.yml'
  push:
    branches: [main]
    paths:
      - 'research/EVIDENCE_ENRICHMENT_ARCHITECTURE.md'
      - 'research/evidence-claims.schema.json'
      - 'research/claims/**'
      - 'research/dossiers/**'
      - 'research/model-evidence/**'
      - 'tests/fixtures/evidence-claims/**'
      - 'research/KNOWLEDGE_FLOW.md'
      - 'research/REPORT_CARD_PIPELINE.md'
      - 'scripts/build_model_evidence_index.py'
      - 'scripts/validate_evidence_architecture.py'
      - '.github/workflows/evidence-architecture.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate evidence enrichment contracts and persisted claims
        run: python scripts/validate_evidence_architecture.py
      - name: Prove model evidence index is reproducible
        run: |
          cp -R research/model-evidence /tmp/model-evidence-before
          python scripts/build_model_evidence_index.py
          diff -ru /tmp/model-evidence-before research/model-evidence
      # The index is a derived completeness contract: every retained model claim must remain represented.
