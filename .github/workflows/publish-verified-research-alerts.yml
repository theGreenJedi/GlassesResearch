name: Publish Verified Research Alerts

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/verified-publications.json'
      - 'docs/RESEARCH_NEWS.md'
      - 'scripts/verified_publications.py'
      - '.github/workflows/publish-verified-research-alerts.yml'
  push:
    branches: [main]
    paths:
      - 'data/verified-publications.json'
      - 'docs/RESEARCH_NEWS.md'
      - 'scripts/verified_publications.py'
      - '.github/workflows/publish-verified-research-alerts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-research-alert-publisher
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate verified publication ledger
        run: python scripts/verified_publications.py

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Require publisher credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo 'Missing required GitHub Actions secret: PUBLISH_TOKEN' >&2
            exit 1
          fi
      - name: Publish explicitly authorized verified research
        run: python scripts/verified_publications.py --publish
      - name: Record publication bridge contract
        shell: bash
        run: |
          {
            echo '### Verified Research Alerts publication bridge'
            echo ''
            echo '- Public research ledger validated.'
            echo '- Watching and discovery intake are excluded by validation.'
            echo '- Only entries with `dispatch: true` were offered to the authenticated Worker endpoint.'
            echo '- Re-running is safe because the Worker records deliveries by subscriber + publication ID.'
          } >> "$GITHUB_STEP_SUMMARY"
