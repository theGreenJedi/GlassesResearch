name: Finder consistency

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/javascripts/glasses-finder-v3.js'
      - 'docs/javascripts/finder-shortlist.js'
      - 'docs/javascripts/purchase-fallbacks.js'
      - 'docs/javascripts/purchase-link-health.js'
      - 'docs/stylesheets/finder-*.css'
      - 'models/THE_LIST.md'
      - 'scripts/build_finder_capabilities.py'
      - 'scripts/apply_finder_capabilities.py'
      - 'scripts/build_report_card_scores.py'
      - 'scripts/build_purchase_fallbacks.py'
      - 'scripts/check_finder_consistency.py'
      - 'scripts/prepare_site.py'
      - 'mkdocs.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'docs/javascripts/glasses-finder-v3.js'
      - 'docs/javascripts/finder-shortlist.js'
      - 'docs/javascripts/purchase-fallbacks.js'
      - 'docs/javascripts/purchase-link-health.js'
      - 'docs/stylesheets/finder-*.css'
      - 'models/THE_LIST.md'
      - 'scripts/build_finder_capabilities.py'
      - 'scripts/apply_finder_capabilities.py'
      - 'scripts/build_report_card_scores.py'
      - 'scripts/build_purchase_fallbacks.py'
      - 'scripts/check_finder_consistency.py'
      - 'scripts/prepare_site.py'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Finder data relationships
        run: python scripts/check_finder_consistency.py
      - name: Build staged site data
        run: python scripts/prepare_site.py
      - name: Require generated Finder assets
        run: |
          test -s .site-src/data/devices.json
          test -s .site-src/data/comparisons.json
          test -s .site-src/data/finder-capabilities.json
          test -s .site-src/data/report-card-scores.json
          test -s .site-src/data/purchase-fallbacks.json
          test -s .site-src/data/purchase-sources.json
          test -s .site-src/data/price-observations.json
      - name: Check Finder JavaScript syntax
        run: |
          node --check docs/javascripts/glasses-finder-v3.js
          node --check docs/javascripts/finder-shortlist.js
          node --check docs/javascripts/purchase-fallbacks.js
          node --check docs/javascripts/purchase-link-health.js
