name: Prove deployed public content

on:
  workflow_run:
    workflows: ["Deploy documentation site"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-content-proof-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  prove-production:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed revision with parent
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Rebuild deployed artifact
        run: |
          python scripts/prepare_site.py
          mkdocs build --strict

      - name: Prove changed public pages are served in production
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD^)"
          python scripts/verify_changed_public_pages.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --site-root site \
            --origin https://glassesresearch.org

      - name: Prove Community Research production canaries
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://glassesresearch.org'
          for attempt in $(seq 1 12); do
            bust="community-proof=${HEAD_SHA}-${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --silent --show-error --location --max-time 20 \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                "${base}/docs/community-research/?${bust}" -o /tmp/community-research.html \
              && curl --fail --silent --show-error --location --max-time 20 \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                "${base}/docs/community-research/bimapdev-smartglasses/?${bust}" -o /tmp/bimapdev.html \
              && grep -Fq 'BimaPDev / SmartGlasses' /tmp/community-research.html \
              && grep -Fq 'BimaPDev / SmartGlasses' /tmp/bimapdev.html \
              && grep -Fq 'Community-primary' /tmp/bimapdev.html; then
              echo 'PROVED: Community Research index and BimaPDev page are retrievable from production with expected content.'
              exit 0
            fi
            echo "Attempt ${attempt}/12: Community Research canaries not proven yet."
            sleep 15
          done
          echo 'ERROR: Community Research production canaries were not retrievable with expected content.' >&2
          exit 1

      - name: Record invariant
        run: echo "DEPLOYED means changed public content and required production canaries were retrieved from production and verified."
