name: Validate Verified Research Alerts Worker

on:
  pull_request:
    paths:
      - 'cloudflare/verified-research-alerts/**'
      - '.github/workflows/alerts-worker-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check Worker JavaScript syntax
        working-directory: cloudflare/verified-research-alerts
        run: node --check src/index.js
      - name: Verify D1 schema exists
        run: test -s cloudflare/verified-research-alerts/schema.sql
      - name: Verify secrets are placeholders only
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E '(re_[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9_-]{24,})' cloudflare/verified-research-alerts
