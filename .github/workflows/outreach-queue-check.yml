name: Validate offline outreach dry run

on:
  pull_request:
    paths:
      - 'scripts/build_outreach_queue.py'
      - 'scripts/build_outreach_drafts.py'
      - 'tests/test_outreach_*.py'
      - 'operations/outreach/**'
      - '.github/workflows/outreach-queue-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test candidate and response review gates
        run: python -m unittest discover -s tests -p 'test_outreach_*.py'
      - name: Regenerate offline candidate queue
        run: python scripts/build_outreach_queue.py
      - name: Regenerate offline reply review packets
        run: python scripts/build_outreach_drafts.py
      - name: Check deterministic committed review artifacts
        run: git diff --exit-code -- operations/outreach/queue.md operations/outreach/replies_for_review.md
