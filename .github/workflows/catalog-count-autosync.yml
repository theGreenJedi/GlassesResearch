name: Canonical catalog auto-sync

on:
  pull_request:
    paths:
      - 'models/THE_LIST.md'
      - 'models/THE_LIST_RECONCILIATION_*.md'
      - 'models/README.md'
      - 'scripts/sync_catalog_counts.py'
      - '.github/workflows/catalog-count-autosync.yml'
  push:
    branches: [main]
    paths:
      - 'models/THE_LIST.md'
      - 'models/THE_LIST_RECONCILIATION_*.md'
      - 'models/README.md'
      - 'scripts/sync_catalog_counts.py'
      - '.github/workflows/catalog-count-autosync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Synchronize approved admissions and derived counts
        run: python scripts/sync_catalog_counts.py
      - name: Validate synchronized canonical ledger
        run: python scripts/check_catalog_consistency.py
      - name: Commit mechanical synchronization when needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Canonical catalog already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/THE_LIST.md models/README.md
          git commit -m 'Synchronize canonical model count'
          git push
