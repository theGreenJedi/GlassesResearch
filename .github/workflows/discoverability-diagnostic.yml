name: Discoverability diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Stage repository documentation
        run: python scripts/prepare_site.py

      - name: Build site
        run: mkdocs build --strict

      - name: Capture discoverability audit
        shell: bash
        run: |
          set +e
          mkdir -p build
          python scripts/verify_discoverability.py > build/discoverability-diagnostic.txt 2>&1
          status=$?
          printf '%s\n' "$status" > build/discoverability-status.txt
          exit 0

      - name: Upload discoverability diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: discoverability-diagnostic
          path: |
            build/discoverability-diagnostic.txt
            build/discoverability-status.txt

      - name: Preserve fail-closed result
        shell: bash
        run: test "$(cat build/discoverability-status.txt)" -eq 0
