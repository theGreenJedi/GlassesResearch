name: Temporary production alerts audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Audit live Worker and Resend ledger without recipient addresses
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --max-time 20 \
            https://alerts.glassesresearch.org/health -o /tmp/health.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/health.json'))
          assert p.get('ok') is True and p.get('service') == 'verified-research-alerts', p
          print('WORKER_HEALTH ok')
          PY

          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo 'RESEND_AUDIT unavailable_missing_secret'
            exit 0
          fi

          curl --fail --silent --show-error --location --max-time 20 \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            'https://api.resend.com/emails?limit=100' -o /tmp/resend.json

          python - <<'PY'
          import collections
          import json

          p=json.load(open('/tmp/resend.json'))
          data=p.get('data') or []
          rows=[]
          counts=collections.Counter()
          event_counts=collections.Counter()
          for item in data:
              subject=str(item.get('subject') or '')
              if subject == 'Confirm your GlassesResearch alerts':
                  kind='confirmation_request'
              elif subject == 'GlassesResearch alerts confirmed':
                  kind='confirmation_success'
              elif subject.startswith('GlassesResearch:'):
                  kind='research_alert'
              else:
                  kind='other'
              event=str(item.get('last_event') or 'unknown')
              counts[kind]+=1
              event_counts[(kind,event)]+=1
              rows.append({
                  'created_at': item.get('created_at'),
                  'kind': kind,
                  'subject': subject,
                  'last_event': event,
                  'recipient_count': len(item.get('to') or []),
              })

          rows.sort(key=lambda r: r.get('created_at') or '', reverse=True)
          research=[r for r in rows if r['kind']=='research_alert']
          confirmations=[r for r in rows if r['kind'] in ('confirmation_request','confirmation_success')]
          print('RESEND_TOTAL', len(rows))
          print('RESEND_KIND_COUNTS', json.dumps(dict(sorted(counts.items())), sort_keys=True))
          print('RESEND_EVENT_COUNTS', json.dumps({f'{k[0]}:{k[1]}':v for k,v in sorted(event_counts.items())}, sort_keys=True))
          print('LATEST_RESEARCH_ALERT', json.dumps(research[0] if research else None, sort_keys=True))
          print('LATEST_CONFIRMATION_MAIL', json.dumps(confirmations[0] if confirmations else None, sort_keys=True))
          print('RECENT_MAIL_NO_ADDRESSES', json.dumps(rows[:20], sort_keys=True))
          PY

      - name: Attempt privacy-safe D1 aggregate audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN_RAW:-}" ]; then
            echo 'D1_AUDIT unavailable_missing_secret'
            exit 0
          fi

          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^Bearer[[:space:]]+//I')"
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $token" -H 'Content-Type: application/json')

          code="$(curl --silent --show-error -w '%{http_code}' "${auth[@]}" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=glassesresearch-alerts" \
            -o /tmp/dbs.json)"
          if [ "$code" != 200 ]; then
            echo "D1_AUDIT unavailable_http_$code"
            exit 0
          fi

          DB_ID="$(python - <<'PY'
          import json
          p=json.load(open('/tmp/dbs.json'))
          rows=p.get('result') or []
          match=[r for r in rows if r.get('name')=='glassesresearch-alerts']
          assert match, 'glassesresearch-alerts D1 database not found'
          print(match[0]['uuid'])
          PY
          )"

          query() {
            local sql="$1" out="$2"
            jq -nc --arg sql "$sql" '{sql:$sql}' > /tmp/query.json
            curl --fail --silent --show-error "${auth[@]}" \
              -X POST "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/query" \
              --data-binary @/tmp/query.json -o "$out"
          }

          query "SELECT COUNT(*) AS total, SUM(CASE WHEN status='active' THEN 1 ELSE 0 END) AS active, SUM(CASE WHEN status='pending' THEN 1 ELSE 0 END) AS pending, SUM(CASE WHEN status='suppressed' THEN 1 ELSE 0 END) AS suppressed, SUM(CASE WHEN last_sent_at IS NOT NULL THEN 1 ELSE 0 END) AS subscribers_with_research_send, MAX(last_sent_at) AS latest_last_sent_at FROM subscribers" /tmp/subscribers.json
          query "SELECT status, cadence, COUNT(*) AS count FROM subscribers GROUP BY status, cadence ORDER BY status, cadence" /tmp/cadences.json
          query "SELECT COUNT(*) AS total, MIN(published_at) AS first_published_at, MAX(published_at) AS latest_published_at FROM published_items" /tmp/published.json
          query "SELECT COUNT(*) AS total, MIN(delivered_at) AS first_delivered_at, MAX(delivered_at) AS latest_delivered_at FROM deliveries" /tmp/deliveries.json

          python - <<'PY'
          import json
          def rows(path):
              p=json.load(open(path))
              result=p.get('result') or []
              assert p.get('success') is True and result and result[0].get('success') is True, p
              return result[0].get('results') or []
          subscribers=rows('/tmp/subscribers.json')
          cadences=rows('/tmp/cadences.json')
          published=rows('/tmp/published.json')
          deliveries=rows('/tmp/deliveries.json')
          print('SUBSCRIBER_SUMMARY', json.dumps(subscribers[0] if subscribers else {}, sort_keys=True))
          print('CADENCE_SUMMARY', json.dumps(cadences, sort_keys=True))
          print('PUBLISHED_SUMMARY', json.dumps(published[0] if published else {}, sort_keys=True))
          print('DELIVERY_SUMMARY', json.dumps(deliveries[0] if deliveries else {}, sort_keys=True))
          PY
