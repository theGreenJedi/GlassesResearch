name: Reset merged newsroom intake branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: newsroom-intake-branch-cleanup
  cancel-in-progress: false

jobs:
  reset:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'automation/newsroom-publication-intake'
    runs-on: ubuntu-latest
    steps:
      - name: Reset persistent intake branch to merged main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAIN_SHA}"
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/git/refs/heads/automation%2Fnewsroom-publication-intake" \
            --data "{\"sha\":\"${MAIN_SHA}\",\"force\":true}"
