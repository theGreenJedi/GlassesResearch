name: Optimizer ledger

on:
  pull_request:
    paths:
      - 'research/OPTIMIZER_LEDGER.yaml'
      - 'scripts/validate_optimizer_ledger.py'
      - '.github/workflows/optimizer-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'research/OPTIMIZER_LEDGER.yaml'
      - 'scripts/validate_optimizer_ledger.py'
      - '.github/workflows/optimizer-ledger.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate durable optimizer/research ledger
        run: python scripts/validate_optimizer_ledger.py
