name: Family Tree Beta Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/family-tree-beta/**'
      - '.github/workflows/family-tree-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-tree-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  beta-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate family-tree beta contract and evidence paths
        run: python experiments/family-tree-beta/build_beta.py

      - name: Stage ordinary GlassesResearch site
        run: python scripts/prepare_site.py

      - name: Inject beta into temporary build only
        run: python experiments/family-tree-beta/build_beta.py --stage

      - name: Build private beta site
        run: mkdocs build -f mkdocs.family-tree-beta.yml --site-dir beta-site --strict

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate beta JavaScript syntax
        run: node --check experiments/family-tree-beta/family-tree-beta.js

      - name: Use runner browser for Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo 'No compatible browser is present on this runner.' >&2
            exit 1
          fi
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"
          echo "Using runner browser: $browser"

      - name: Serve private beta build
        shell: bash
        run: |
          python -m http.server 4173 --directory beta-site >/tmp/family-tree-beta-http.log 2>&1 &
          echo $! > /tmp/family-tree-beta-http.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/__beta/FAMILY_TREE/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/family-tree-beta-http.log
          exit 1

      - name: Exercise interactions and capture desktop/mobile screenshots
        run: node experiments/family-tree-beta/test_beta.mjs

      - name: Upload private beta preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-tree-beta-preview
          path: |
            family-tree-beta-artifacts/
            beta-site/__beta/FAMILY_TREE/
          if-no-files-found: error
          retention-days: 30
