name: Purchase link health

on:
  workflow_dispatch:
  schedule:
    # Staggered away from the 09:17 UTC timeline job.
    - cron: '29 9 * * *'

permissions:
  contents: write

concurrency:
  group: purchase-link-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check purchase links
        run: python scripts/check_purchase_links.py

      - name: Commit health ledger when changed
        run: |
          if git diff --quiet -- data/purchase-link-health.json research/purchase-link-replacement-queue.md; then
            echo "No purchase-link health changes."
            exit 0
          fi
          git config user.name "glassesresearch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/purchase-link-health.json research/purchase-link-replacement-queue.md
          git commit -m "Update purchase link health ledger"
          git push
