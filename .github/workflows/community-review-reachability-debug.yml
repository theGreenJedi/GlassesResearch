name: Community Review Reachability Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/community-review-reachability-debug.yml'
      - 'docs/COMMUNITY_REVIEWS.md'
      - 'docs/COMMUNITY_REVIEWERS.md'
      - 'docs/CONTENTS.md'
      - 'docs/CONTRIBUTORS.md'
      - 'scripts/build_community_reviews.py'
      - 'scripts/prepare_site.py'
      - 'mkdocs.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: Build site and capture reachability result
        shell: bash
        run: |
          set +e
          mkdir -p build
          python scripts/prepare_site.py > build/reachability-debug.txt 2>&1
          prep=$?
          if [ "$prep" -eq 0 ]; then
            mkdocs build --strict >> build/reachability-debug.txt 2>&1
            build_status=$?
          else
            build_status=$prep
          fi
          if [ "$build_status" -eq 0 ]; then
            python scripts/verify_public_reachability.py >> build/reachability-debug.txt 2>&1
            reach=$?
          else
            reach=$build_status
          fi
          printf '\nprep=%s build=%s reach=%s\n' "$prep" "$build_status" "$reach" >> build/reachability-debug.txt
          exit "$reach"
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-review-reachability-debug
          path: build/reachability-debug.txt
