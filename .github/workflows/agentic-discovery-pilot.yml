name: Agentic discovery measurement pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/agentic_discovery.py'
      - 'tests/test_agentic_discovery.py'
      - '.github/workflows/agentic-discovery-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'experiment/agentic-discovery-20261118' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python -m unittest discover -s tests -p test_agentic_discovery.py
      - name: Measure read-only Cloudflare data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: python scripts/agentic_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-discovery
          path: build/agentic-discovery.json
