name: Deploy Verified Research Alerts Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-alerts-canary.yml'
      - 'cloudflare/verified-research-canary/**'

permissions:
  contents: read

concurrency:
  group: verified-research-alerts-canary
  cancel-in-progress: false

jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CANARY_DOMAIN: canary.glassesresearch.org
      CANARY_ADDRESS: delivery@canary.glassesresearch.org
      CANARY_WORKER: glassesresearch-alert-canary

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Wrangler for canary Worker
        run: npm install --prefix cloudflare/verified-research-canary

      - name: Verify and normalize canary deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN_RAW PUBLISH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^Bearer[[:space:]]+//I')"
          if [[ "$token" != cfat_* ]] || [[ "$token" =~ [[:space:]] ]]; then
            echo 'Cloudflare token is not in the expected account-token format.' >&2
            exit 1
          fi
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          status="$(curl --silent --show-error -o /tmp/token.json -w '%{http_code}' -H "Authorization: Bearer $token" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          if [ "$status" != 200 ] || ! jq -e '.success == true and .result.status == "active"' /tmp/token.json >/dev/null 2>&1; then
            echo "Cloudflare API token is not active (HTTP $status)." >&2
            exit 1
          fi

      - name: Resolve canary zone and D1 database
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          curl --fail --silent --show-error "${auth[@]}" "$api/zones?name=glassesresearch.org&status=active" -o /tmp/zones.json
          ZONE_ID="$(jq -r --arg account "$CLOUDFLARE_ACCOUNT_ID" '.result[] | select(.account.id == $account) | .id' /tmp/zones.json | head -n1)"
          if [ -z "$ZONE_ID" ]; then
            echo 'Unable to resolve active glassesresearch.org zone. Canary provisioning needs Zone Read.' >&2
            exit 1
          fi

          cd cloudflare/verified-research-canary
          DB_ID="$(npx wrangler d1 list --json | jq -r --arg name 'glassesresearch-alerts' '.[] | select(.name == $name) | .uuid' | head -n1)"
          if [ -z "$DB_ID" ]; then
            echo 'Unable to resolve glassesresearch-alerts D1 database. Deploy the subscriber alert Worker first and grant D1 access.' >&2
            exit 1
          fi
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build canary Wrangler configuration
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.cloudflare.outputs.database_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const path = 'cloudflare/verified-research-canary/wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.d1_databases[0].database_id = process.env.D1_DATABASE_ID;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Deploy receiving canary Worker and install verifier secret
        working-directory: cloudflare/verified-research-canary
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy
          printf '%s' "$PUBLISH_TOKEN" | npx wrangler secret put PUBLISH_TOKEN

      - name: Provision isolated Email Routing canary
        shell: bash
        env:
          ZONE_ID: ${{ steps.cloudflare.outputs.zone_id }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          for type in MX TXT; do
            curl --fail --silent --show-error "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?type=$type&name=glassesresearch.org&per_page=100" \
              | jq -S '[.result[] | {type,name,content,priority:(.priority // null)}] | sort_by(.type,.name,.content,.priority)' > "/tmp/apex-$type-before.json"
          done

          curl --fail --silent --show-error "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/dns?subdomain=$CANARY_DOMAIN" -o /tmp/canary-dns-before.json
          configured="$(jq -r '(.success == true) and ((.result.errors // []) | length == 0)' /tmp/canary-dns-before.json)"
          if [ "$configured" != true ]; then
            status="$(curl --silent --show-error -o /tmp/canary-enable.json -w '%{http_code}' -X POST "${auth[@]}" \
              --data "$(jq -nc --arg name "$CANARY_DOMAIN" '{name:$name}')" "$api/zones/$ZONE_ID/email/routing/dns" || true)"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ] || ! jq -e '.success == true' /tmp/canary-enable.json >/dev/null 2>&1; then
              echo "Unable to enable Email Routing for $CANARY_DOMAIN (HTTP $status). Canary token needs the relevant Zone/Email Routing write scopes." >&2
              cat /tmp/canary-enable.json >&2 || true
              exit 1
            fi
          fi

          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/dns?subdomain=$CANARY_DOMAIN" -o /tmp/canary-dns.json
            if jq -e '.success == true and ((.result.errors // []) | length == 0)' /tmp/canary-dns.json >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Email Routing DNS for $CANARY_DOMAIN is not ready." >&2
              cat /tmp/canary-dns.json >&2
              exit 1
            fi
            sleep 10
          done

          desired="$(jq -nc --arg address "$CANARY_ADDRESS" --arg worker "$CANARY_WORKER" '{name:"GlassesResearch verified-alert delivery canary",enabled:true,matchers:[{type:"literal",field:"to",value:$address}],actions:[{type:"worker",value:[$worker]}],source:"api"}')"
          curl --fail --silent --show-error "${auth[@]}" "$api/zones/$ZONE_ID/email/routing/rules?per_page=100" -o /tmp/rules.json
          RULE_ID="$(jq -r --arg address "$CANARY_ADDRESS" '.result[] | select(any(.matchers[]?; .type == "literal" and .field == "to" and .value == $address)) | .id' /tmp/rules.json | head -n1)"
          if [ -n "$RULE_ID" ]; then
            curl --fail --silent --show-error -X PUT "${auth[@]}" --data "$desired" "$api/zones/$ZONE_ID/email/routing/rules/$RULE_ID" -o /tmp/rule-write.json
          else
            curl --fail --silent --show-error -X POST "${auth[@]}" --data "$desired" "$api/zones/$ZONE_ID/email/routing/rules" -o /tmp/rule-write.json
          fi
          if ! jq -e --arg address "$CANARY_ADDRESS" --arg worker "$CANARY_WORKER" \
            '.success == true and .result.enabled == true and any(.result.matchers[]?; .value == $address) and any(.result.actions[]?; .type == "worker" and (.value // [] | index($worker)))' \
            /tmp/rule-write.json >/dev/null; then
            echo 'Canary Email Routing rule could not be created or updated.' >&2
            cat /tmp/rule-write.json >&2
            exit 1
          fi

          for type in MX TXT; do
            curl --fail --silent --show-error "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?type=$type&name=glassesresearch.org&per_page=100" \
              | jq -S '[.result[] | {type,name,content,priority:(.priority // null)}] | sort_by(.type,.name,.content,.priority)' > "/tmp/apex-$type-after.json"
            diff -u "/tmp/apex-$type-before.json" "/tmp/apex-$type-after.json" || {
              echo "Refusing canary deployment: apex $type records changed while configuring isolated subdomain." >&2
              exit 1
            }
          done

      - name: Verify subscriber Worker remains healthy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://alerts.glassesresearch.org/health | tee /tmp/alerts-health.json
          jq -e '.ok == true and .service == "verified-research-alerts"' /tmp/alerts-health.json >/dev/null
