name: Across the wire contract

on:
  pull_request:
    paths:
      - "data/wire-state.json"
      - "docs/javascripts/research-news-newsroom.js"
      - "docs/stylesheets/research-news-newsroom.css"
      - "scripts/verify_wire_state.py"
      - "scripts/import_wire_news.py"
      - "scripts/test_import_wire_news.py"
      - ".github/workflows/hourly-news-intake.yml"
      - ".github/workflows/wire-state-check.yml"
  push:
    branches: [main]
    paths:
      - "data/wire-state.json"
      - "docs/javascripts/research-news-newsroom.js"
      - "docs/stylesheets/research-news-newsroom.css"
      - "scripts/verify_wire_state.py"
      - "scripts/import_wire_news.py"
      - "scripts/test_import_wire_news.py"
      - ".github/workflows/hourly-news-intake.yml"
      - ".github/workflows/wire-state-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate wire state
        run: python scripts/verify_wire_state.py --state data/wire-state.json
      - name: Validate wire-to-triage bridge
        run: |
          python scripts/test_import_wire_news.py
          python scripts/import_wire_news.py --wire data/wire-state.json --output /tmp/wire-latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/wire-latest.json').read_text(encoding='utf-8'))
          if payload.get('candidate_count') != len(payload.get('candidates', [])):
              raise SystemExit('Wire bridge candidate count drifted')
          if any(item.get('relationship') != 'direct' for item in payload.get('candidates', [])):
              raise SystemExit('Wire bridge must hand reports to editorial triage as direct unverified leads')
          if any(item.get('publication_eligible') is not True for item in payload.get('candidates', [])):
              raise SystemExit('Wire reports must remain eligible for verification review')
          print(f"Wire bridge fixture verified: candidates={payload.get('candidate_count', 0)}")
          PY
      - name: Verify newsroom consumes the live wire with a static fallback
        run: |
          grep -q '/data/newsroom-state.json' docs/javascripts/research-news-newsroom.js
          grep -q 'for (const endpoint of \["/wire", "/data/wire-state.json"\])' docs/javascripts/research-news-newsroom.js
          grep -q 'Across the wire' docs/javascripts/research-news-newsroom.js
          grep -q 'not verified GlassesResearch claims' data/wire-state.json
      - name: Verify newsroom JavaScript syntax
        run: node --check docs/javascripts/research-news-newsroom.js
