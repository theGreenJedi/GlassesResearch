name: Cloudflare Traffic Breakdown

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traffic-breakdown:
    runs-on: ubuntu-latest
    steps:
      - name: Query and classify Cloudflare traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not available."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "CLOUDFLARE_ZONE_ID is not available."
            exit 1
          fi

          python - <<'PY'
          import json, os

          zone = os.environ['CLOUDFLARE_ZONE_ID']
          start = os.popen("date -u -d '24 hours ago' +%FT%TZ").read().strip()
          end = os.popen("date -u +%FT%TZ").read().strip()

          query = '''query TrafficBreakdown($zoneTag: string, $filter: filter) {
            viewer {
              zones(filter: {zoneTag: $zoneTag}) {
                totals: httpRequestsAdaptiveGroups(limit: 1, filter: $filter) {
                  count
                  sum { visits edgeResponseBytes }
                }
                countries: httpRequestsAdaptiveGroups(limit: 20, filter: $filter, orderBy: [count_DESC]) {
                  count
                  sum { visits }
                  dimensions { clientCountryName }
                }
                paths: httpRequestsAdaptiveGroups(limit: 100, filter: $filter, orderBy: [count_DESC]) {
                  count
                  sum { visits }
                  dimensions { clientRequestPath }
                }
                userAgents: httpRequestsAdaptiveGroups(limit: 100, filter: $filter, orderBy: [count_DESC]) {
                  count
                  sum { visits }
                  dimensions { userAgent }
                }
              }
            }
          }'''

          payload = {
            'query': query,
            'variables': {
              'zoneTag': zone,
              'filter': {
                'datetime_geq': start,
                'datetime_lt': end,
                'requestSource': 'eyeball'
              }
            }
          }
          with open('/tmp/query.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f)
          PY

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/response.json \
            --write-out '%{http_code}' \
            --request POST \
            --url https://api.cloudflare.com/client/v4/graphql \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data @/tmp/query.json)

          echo "Cloudflare HTTP status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Cloudflare request failed."
            cat /tmp/response.json
            exit 1
          fi

          python - <<'PY'
          import json, re, sys

          with open('/tmp/response.json', encoding='utf-8') as f:
              payload = json.load(f)

          if payload.get('errors'):
              print('Cloudflare GraphQL returned errors:')
              print(json.dumps(payload['errors'], indent=2))
              sys.exit(1)

          zones = payload.get('data', {}).get('viewer', {}).get('zones', [])
          if not zones:
              print('No matching zone returned.')
              sys.exit(1)

          z = zones[0]
          totals = z.get('totals', [])
          t = totals[0] if totals else {}
          total_requests = t.get('count', 0)
          total_visits = t.get('sum', {}).get('visits', 0)

          known_bot = re.compile(
              r'(bot|crawler|spider|slurp|semrush|seranking|ahrefs|bytespider|applebot|googlebot|bingbot|duckduckbot|baiduspider|yandex|facebookexternalhit|petalbot|mj12bot|dotbot)',
              re.I,
          )
          suspicious_path = re.compile(
              r'(^|/)(\.git|\.env|env\.json|stripe-keys\.json|serverless\.yml|\.aws|wp-admin|wp-login|phpmyadmin|config\.php|credentials|id_rsa|passwd|actuator|rest/executions|rest/users|api/user)(/|$)',
              re.I,
          )

          bot_visits = bot_requests = 0
          humanish_visits = humanish_requests = 0
          unclassified_visits = unclassified_requests = 0
          known_bots = []

          for row in z.get('userAgents', []):
              ua = row.get('dimensions', {}).get('userAgent') or ''
              req = row.get('count', 0)
              visits = row.get('sum', {}).get('visits', 0)
              if known_bot.search(ua):
                  bot_visits += visits
                  bot_requests += req
                  known_bots.append((visits, req, ua))
              elif visits > 0 and ua:
                  humanish_visits += visits
                  humanish_requests += req
              else:
                  unclassified_visits += visits
                  unclassified_requests += req

          scanner_requests = 0
          scanner_paths = []
          for row in z.get('paths', []):
              path = row.get('dimensions', {}).get('clientRequestPath') or ''
              req = row.get('count', 0)
              if suspicious_path.search(path):
                  scanner_requests += req
                  scanner_paths.append((req, path))

          print('\n=== GLASSESRESEARCH TRAFFIC CLASSIFIER ===')
          print('Window: rolling 24 hours; Cloudflare requestSource=eyeball')
          print('\nRAW TOTALS')
          print(f'  Requests: {total_requests}')
          print(f'  Visits:   {total_visits}')

          print('\nVISIT CLASSIFICATION (heuristic; based on top user-agent groups)')
          print(f'  Human-like visits:      {humanish_visits}')
          print(f'  Known crawler visits:   {bot_visits}')
          print(f'  Unclassified visits:    {unclassified_visits}')
          print('  Note: browser user agents can be spoofed, so "human-like" is not a person count.')

          print('\nREQUEST SIGNALS')
          print(f'  Human-like UA requests: {humanish_requests}')
          print(f'  Known crawler requests: {bot_requests}')
          print(f'  Suspicious scan-path requests among top paths: {scanner_requests}')

          print('\nTOP COUNTRIES')
          for row in z.get('countries', [])[:12]:
              print(f"  {row.get('dimensions', {}).get('clientCountryName') or '(unknown)'}: requests={row.get('count', 0)}, visits={row.get('sum', {}).get('visits', 0)}")

          print('\nKNOWN CRAWLERS')
          for visits, req, ua in sorted(known_bots, reverse=True)[:12]:
              print(f'  visits={visits}, requests={req}: {ua}')

          print('\nSUSPICIOUS SCAN PATHS')
          for req, path in sorted(scanner_paths, reverse=True)[:20]:
              print(f'  requests={req}: {path}')
          if not scanner_paths:
              print('  None found among top paths.')
          PY
