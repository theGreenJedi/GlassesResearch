name: Cloudflare Traffic Breakdown

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traffic-breakdown:
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare end-user traffic breakdown
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not available."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "CLOUDFLARE_ZONE_ID is not available."
            exit 1
          fi

          START=$(date -u -d '7 days ago' +%FT%TZ)
          END=$(date -u +%FT%TZ)

          python - <<'PY'
          import json, os

          zone = os.environ['CLOUDFLARE_ZONE_ID']
          start = os.popen("date -u -d '7 days ago' +%FT%TZ").read().strip()
          end = os.popen("date -u +%FT%TZ").read().strip()

          query = '''query TrafficBreakdown($zoneTag: string, $filter: filter) {
            viewer {
              zones(filter: {zoneTag: $zoneTag}) {
                totals: httpRequestsAdaptiveGroups(limit: 1, filter: $filter) {
                  count
                  sum { visits edgeResponseBytes }
                }
                countries: httpRequestsAdaptiveGroups(limit: 20, filter: $filter, orderBy: [count_DESC]) {
                  count
                  sum { visits }
                  dimensions { clientCountryName }
                }
                paths: httpRequestsAdaptiveGroups(limit: 25, filter: $filter, orderBy: [count_DESC]) {
                  count
                  sum { visits }
                  dimensions { clientRequestPath }
                }
                devices: httpRequestsAdaptiveGroups(limit: 10, filter: $filter, orderBy: [count_DESC]) {
                  count
                  sum { visits }
                  dimensions { clientDeviceType }
                }
                userAgents: httpRequestsAdaptiveGroups(limit: 20, filter: $filter, orderBy: [count_DESC]) {
                  count
                  sum { visits }
                  dimensions { userAgent }
                }
              }
            }
          }'''

          payload = {
            'query': query,
            'variables': {
              'zoneTag': zone,
              'filter': {
                'datetime_geq': start,
                'datetime_lt': end,
                'requestSource': 'eyeball'
              }
            }
          }
          with open('/tmp/query.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f)
          PY

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/response.json \
            --write-out '%{http_code}' \
            --request POST \
            --url https://api.cloudflare.com/client/v4/graphql \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data @/tmp/query.json)

          echo "Cloudflare HTTP status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Cloudflare request failed."
            cat /tmp/response.json
            exit 1
          fi

          python - <<'PY'
          import json, sys

          with open('/tmp/response.json', encoding='utf-8') as f:
              payload = json.load(f)

          if payload.get('errors'):
              print('Cloudflare GraphQL returned errors:')
              print(json.dumps(payload['errors'], indent=2))
              sys.exit(1)

          zones = payload.get('data', {}).get('viewer', {}).get('zones', [])
          if not zones:
              print('No matching zone returned.')
              sys.exit(1)

          z = zones[0]
          print('\n=== CLOUDFLARE END-USER TRAFFIC DIAGNOSTIC ===')
          print('Filter: requestSource=eyeball; rolling 7 days')

          totals = z.get('totals', [])
          if totals:
              t = totals[0]
              print(f"\nTOTALS: requests={t.get('count', 0)}, visits={t.get('sum', {}).get('visits', 0)}, bytes={t.get('sum', {}).get('edgeResponseBytes', 0)}")

          def show(title, rows, dim):
              print(f'\n--- {title} ---')
              for row in rows:
                  label = row.get('dimensions', {}).get(dim) or '(unknown/direct)'
                  print(f"{label}: requests={row.get('count', 0)}, visits={row.get('sum', {}).get('visits', 0)}")

          show('TOP COUNTRIES', z.get('countries', []), 'clientCountryName')
          show('TOP PATHS', z.get('paths', []), 'clientRequestPath')
          show('DEVICE TYPES', z.get('devices', []), 'clientDeviceType')
          show('TOP USER AGENTS', z.get('userAgents', []), 'userAgent')
          PY
