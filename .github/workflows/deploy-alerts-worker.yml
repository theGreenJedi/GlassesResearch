name: Deploy Verified Research Alerts Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-alerts-worker.yml'
      - 'cloudflare/verified-research-alerts/**'

permissions:
  contents: read

concurrency:
  group: verified-research-alerts-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Wrangler for alerts Worker
        run: npm install --prefix cloudflare/verified-research-alerts

      - name: Verify deployment credentials and core Cloudflare scopes
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN_RAW RESEND_API_KEY PUBLISH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^Bearer[[:space:]]+//I')"
          if [[ "$token" != cfat_* ]]; then
            echo 'Cloudflare token is not in the expected account-token format (cfat_...). Re-copy only the token value from Cloudflare.' >&2
            exit 1
          fi
          if [[ "$token" =~ [[:space:]] ]]; then
            echo 'Cloudflare token contains embedded whitespace. Re-copy only the token value from Cloudflare.' >&2
            exit 1
          fi
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $token")

          status="$(curl --silent --show-error -o /tmp/token.json -w '%{http_code}' "${auth[@]}" "$api/user/tokens/verify" || true)"
          if [ "$status" != 200 ] || ! jq -e '.success == true and .result.status == "active"' /tmp/token.json >/dev/null 2>&1; then
            echo "Cloudflare API token is not active (HTTP $status)." >&2
            exit 1
          fi

          status="$(curl --silent --show-error -o /tmp/zone.json -w '%{http_code}' "${auth[@]}" "$api/zones?name=glassesresearch.org&status=active" || true)"
          if [ "$status" != 200 ] || ! jq -e --arg account "$CLOUDFLARE_ACCOUNT_ID" '.success == true and (.result | length) > 0 and .result[0].account.id == $account' /tmp/zone.json >/dev/null 2>&1; then
            echo 'Cloudflare token cannot read the glassesresearch.org zone in the configured account. Grant Zone Read for glassesresearch.org.' >&2
            exit 1
          fi

          status="$(curl --silent --show-error -o /tmp/worker-settings.json -w '%{http_code}' "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/glassesresearch-alerts/settings" || true)"
          if [ "$status" = 403 ]; then
            echo 'Cloudflare token is active but lacks Workers Scripts access for this account. Grant Account -> Workers Scripts Write.' >&2
            exit 1
          fi
          if [ "$status" != 200 ] && [ "$status" != 404 ]; then
            echo "Unable to inspect the alerts Worker before deployment (HTTP $status)." >&2
            cat /tmp/worker-settings.json >&2 || true
            exit 1
          fi

      - name: Resolve D1 database
        id: d1
        working-directory: cloudflare/verified-research-alerts
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx wrangler d1 list --json > /tmp/d1-list.json 2>/tmp/d1-list.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'Cloudflare token cannot list the production D1 database. Grant Account -> D1 Write (or D1 Read plus the write permission required for schema updates).' >&2
            cat /tmp/d1-list.err >&2 || true
            exit "$rc"
          fi

          DB_ID="$(jq -r --arg name 'glassesresearch-alerts' '.[] | select(.name == $name) | .uuid' /tmp/d1-list.json | head -n1)"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create glassesresearch-alerts
            npx wrangler d1 list --json > /tmp/d1-list.json
            DB_ID="$(jq -r --arg name 'glassesresearch-alerts' '.[] | select(.name == $name) | .uuid' /tmp/d1-list.json | head -n1)"
          fi
          if [ -z "$DB_ID" ]; then
            echo 'Unable to resolve production D1 database ID.' >&2
            exit 1
          fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Build production Wrangler configuration
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const path = 'cloudflare/verified-research-alerts/wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.d1_databases[0].database_id = process.env.D1_DATABASE_ID;
          config.workers_dev = false;
          config.routes = [{ pattern: 'alerts.glassesresearch.org', custom_domain: true }];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Apply production D1 schema
        working-directory: cloudflare/verified-research-alerts
        run: npx wrangler d1 execute glassesresearch-alerts --remote --file=schema.sql --yes

      - name: Deploy subscriber alert Worker and install secrets
        working-directory: cloudflare/verified-research-alerts
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          printf '%s' "$PUBLISH_TOKEN" | npx wrangler secret put PUBLISH_TOKEN

      - name: Verify current subscriber alert Worker is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 https://alerts.glassesresearch.org/health | tee /tmp/alerts-health.json; then
              if jq -e '.ok == true and .service == "verified-research-alerts" and .cadence_jitter_tolerance_ms == 300000' /tmp/alerts-health.json >/dev/null; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Production Worker did not expose the current cadence-fix health signature after deployment.' >&2
          cat /tmp/alerts-health.json >&2 || true
          exit 1
