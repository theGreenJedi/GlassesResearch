name: Daily whole-site link review

on:
  workflow_dispatch:
  schedule:
    - cron: '37 10 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/daily-site-link-review.yml'
      - 'scripts/verify_built_site_links.py'
      - 'scripts/audit_repository.py'
      - 'requirements-docs.txt'
      - 'mkdocs.yml'

permissions:
  contents: read

concurrency:
  group: daily-site-link-review
  cancel-in-progress: false

jobs:
  review:
    name: Review every page and link
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Inventory repository links
        run: python scripts/audit_repository.py --external-output build/external-links.txt

      - name: Stage and build the complete site
        run: |
          python scripts/prepare_site.py
          mkdocs build --strict

      - name: Verify every internal page, anchor, and asset
        run: python scripts/verify_built_site_links.py

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f -name '*.js' -print0)

      - name: Check all external links
        id: external
        uses: lycheeverse/lychee-action@v2
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          args: >-
            --no-progress
            --max-retries 2
            --retry-wait-time 2
            --timeout 20
            --accept 200..=399,403,405,429
            --user-agent "GlassesResearch-LinkReview/1.0 (+https://glassesresearch.org/)"
            --format detailed
            --output build/external-link-report.md
            build/external-links.txt
          fail: true

      - name: Add review summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Daily whole-site link review'
            echo
            if [[ -f build/external-links.txt ]]; then
              echo "- External URLs inventoried: $(grep -cve '^$' build/external-links.txt)"
            fi
            if [[ -d site ]]; then
              echo "- HTML pages built: $(find site -type f -name '*.html' | wc -l)"
            fi
            echo "- Internal pages, fragments, static assets, JavaScript, and canonical model paths were checked before the external crawl."
            if [[ -f build/external-link-report.md ]]; then
              echo
              cat build/external-link-report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload link-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-site-link-review
          path: |
            build/external-links.txt
            build/external-link-report.md
          if-no-files-found: warn
          retention-days: 30
