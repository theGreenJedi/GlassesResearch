name: Refresh developing news wire

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
      - knowledge-intake
    paths:
      - ".github/workflows/search-wire.yml"
      - "research/news-reviews/queue.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: search-wire-writer
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate review-state synchronization
        run: python scripts/test_sync_wire_review_state.py

      - name: Pull current commodity search/news wheels
        run: python scripts/refresh_search_wire.py --output data/wire-state.json --max-items 18

      - name: Reapply durable editorial review state
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin knowledge-intake; then
            if git show origin/knowledge-intake:research/news-reviews/queue.json > /tmp/news-review-queue.json 2>/dev/null; then
              python scripts/sync_wire_review_state.py \
                --wire data/wire-state.json \
                --queue /tmp/news-review-queue.json
            else
              echo "No durable editorial queue available yet; leaving reports in discovery state."
            fi
          else
            echo "Durable editorial branch unavailable; leaving reports in discovery state."
          fi

      - name: Validate public wire contract
        run: python scripts/verify_wire_state.py --state data/wire-state.json

      - name: Publish only when the visible wire changed
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/wire-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No developing-wire change."
            exit 0
          fi
          git config user.name "glassesresearch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wire-state.json
          git commit -m "Refresh developing smart-glasses wire"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy bot-written wire changes
        if: steps.publish.outputs.changed == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
