name: Catalog consistency

on:
  pull_request:
    paths:
      - 'README.md'
      - 'models/**'
      - 'lineages/**'
      - 'mkdocs.yml'
      - 'scripts/build_device_database.py'
      - 'scripts/check_catalog_consistency.py'
      - 'scripts/check_model_profiles.py'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'models/**'
      - 'lineages/**'
      - 'mkdocs.yml'
      - 'scripts/build_device_database.py'
      - 'scripts/check_catalog_consistency.py'
      - 'scripts/check_model_profiles.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check canonical model and lineage propagation
        run: python scripts/check_catalog_consistency.py
      - name: Require an editorial profile for every canonical model
        run: python scripts/check_model_profiles.py --strict
      - name: Validate public device research paths
        run: python scripts/build_device_database.py --validate-only
