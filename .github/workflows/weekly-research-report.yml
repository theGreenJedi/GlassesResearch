name: Weekly GlassesResearch Report

on:
  workflow_dispatch:
  schedule:
    # 1:45 PM Eastern Friday.
    # Run both UTC equivalents and gate on the active Eastern offset.
    - cron: '45 17 * * 5' # EDT
    - cron: '45 18 * * 5' # EST

permissions:
  contents: read
  pull-requests: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Friday 1:45 PM Eastern cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OFFSET="$(TZ=America/New_York date +%z)"
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "45 17 * * 5" ] && [ "$OFFSET" = "-0400" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "45 18 * * 5" ] && [ "$OFFSET" = "-0500" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Install report dependencies
        if: steps.cadence.outputs.run == 'true'
        run: python -m pip install --quiet google-auth requests

      - name: Generate combined analytics report
        if: steps.cadence.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: python scripts/generate_weekly_report.py

      - name: Upload Friday analytics report
        if: steps.cadence.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: glassesresearch-weekly-report
          path: weekly-report.md
          retention-days: 90

      - name: Publish report to job summary
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: cat weekly-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Inactive DST counterpart
        if: steps.cadence.outputs.run == 'false'
        run: echo 'Inactive Eastern-time schedule; no report generated.'
