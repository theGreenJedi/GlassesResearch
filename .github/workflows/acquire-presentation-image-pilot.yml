name: Acquire presentation image pilot

on:
  push:
    branches: [presentation-mission]
    paths:
      - '.github/workflows/acquire-presentation-image-pilot.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: presentation-mission
      - name: Acquire governed manufacturer originals
        shell: python
        run: |
          import json, pathlib, urllib.request
          items = {
            "GLS-0042": ("https://images.ctfassets.net/o1znirz7lzo4/7DJEtR43qj88q0XXegp3Hw/cfb4193360f1de7c54c9c5efa1173d04/1_PRIMARY_Spectacles3_Campaign.jpg?fm=jpg&w=1600&q=85", "jpg"),
          }
          root=pathlib.Path(".")
          out=root/"images/models/original"; out.mkdir(parents=True,exist_ok=True)
          regp=root/"data/model-visuals.json"; data=json.loads(regp.read_text())
          for mid,(url,ext) in items.items():
            path=out/f"{mid.lower()}.{ext}"
            req=urllib.request.Request(url,headers={"User-Agent":"GlassesResearch/1.0 editorial research"})
            with urllib.request.urlopen(req,timeout=45) as r: path.write_bytes(r.read())
            rec=data["records"][mid]
            rec["original_image"]="/"+str(path).replace("\\","/")
            rec["source_asset_url"]=url
            rec["state"]="cleared"
          regp.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
      - name: Validate acquired originals
        run: |
          pip install -r requirements-docs.txt
          python scripts/normalize_model_visuals.py --registry data/model-visuals.json --root . --output-root .site-image-pilot
          python scripts/verify_model_visuals.py --registry .site-image-pilot/data/model-visuals.json --root .site-image-pilot --models models/THE_LIST.md
      - name: Commit acquired originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/models/original data/model-visuals.json
          if git diff --cached --quiet; then
            echo "No new acquisition changes to commit"
            exit 0
          fi
          git commit -m "Acquire governed presentation originals"
          git push origin HEAD:presentation-mission

