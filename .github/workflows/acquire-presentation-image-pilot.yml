name: Acquire candidate presentation images
# normalization-audit: v3

on:
  workflow_dispatch:
  push:
    branches: [presentation-mission]
    paths:
      - '.github/workflows/acquire-presentation-image-pilot.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: presentation-mission
      - name: Discover manufacturer page images
        shell: python
        run: |
          import json, pathlib, urllib.request, urllib.parse, re
          root=pathlib.Path(".")
          out=root/"images/models/original"; out.mkdir(parents=True,exist_ok=True)
          regp=root/"data/model-visuals.json"; data=json.loads(regp.read_text())
          success=[]; failed=[]
          for mid,rec in data["records"].items():
            if rec.get("state")!="candidate" or rec.get("original_image"): continue
            page=rec.get("source_url","")
            if not page: continue
            try:
              req=urllib.request.Request(page,headers={"User-Agent":"Mozilla/5.0 GlassesResearch editorial research"})
              html=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
              pats=[
                r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
                r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
                r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)'
              ]
              image=None
              for pat in pats:
                m=re.search(pat,html,re.I)
                if m: image=urllib.parse.urljoin(page,m.group(1).replace("&amp;","&")); break
              if not image:
                target=set(re.findall(r"[a-z0-9]+",rec.get("alt","").lower()))
                target-={"smart","glasses","glass","the","and","with","black","frame"}
                ranked=[]
                for tag in re.findall(r"<img\\b[^>]*>",html,re.I):
                  am=re.search(r'alt=["\\\']([^"\\\']*)',tag,re.I)
                  sm=re.search(r'(?:src|data-src)=["\\\']([^"\\\']+)',tag,re.I)
                  if not sm: continue
                  u=urllib.parse.urljoin(page,sm.group(1).replace("&amp;","&"))
                  hay=((am.group(1) if am else "")+" "+u).lower()
                  score=sum(1 for t in target if t in hay)
                  if any(x in hay for x in ("logo","icon","avatar","flag")): score-=5
                  ranked.append((score,u))
                ranked.sort(reverse=True)
                if ranked and ranked[0][0]>0: image=ranked[0][1]
              if not image: raise RuntimeError("no model-matched image")
              req=urllib.request.Request(image,headers={"User-Agent":"Mozilla/5.0 GlassesResearch editorial research","Referer":page})
              with urllib.request.urlopen(req,timeout=45) as resp:
                blob=resp.read(); ctype=resp.headers.get_content_type()
              if not ctype.startswith("image/") or len(blob)<5000: raise RuntimeError(f"bad image {ctype} {len(blob)}")
              ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}.get(ctype)
              if not ext: raise RuntimeError(f"unsupported {ctype}")
              path=out/f"{mid.lower()}.{ext}"; path.write_bytes(blob)
              rec["original_image"]="/"+str(path).replace("\\","/")
              rec["source_asset_url"]=image
              rec["acquisition_note"]=(rec.get("acquisition_note","")+" Candidate image auto-discovered from manufacturer-controlled page metadata; requires visual QA before clearance.").strip()
              success.append(mid)
            except Exception as e:
              failed.append((mid,str(e)))
              print(f"::warning::{mid}: {e}")
          regp.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("ACQUIRED",len(success),success)
          print("FAILED",len(failed),failed)
      - name: Build visual QA contact sheet
        shell: python
        run: |
          from PIL import Image,ImageOps,ImageDraw
          import json,pathlib,math
          root=pathlib.Path("."); data=json.loads((root/"data/model-visuals.json").read_text())
          items=[(mid,rec) for mid,rec in data["records"].items() if rec.get("original_image")]
          tw,th=360,250; cols=4; rows=math.ceil(len(items)/cols)
          sheet=Image.new("RGB",(cols*tw,rows*th),"white"); draw=ImageDraw.Draw(sheet)
          for i,(mid,rec) in enumerate(items):
            p=root/rec["original_image"].lstrip("/")
            with Image.open(p) as im:
              im=ImageOps.exif_transpose(im).convert("RGBA")
              bg=Image.new("RGBA",(tw-20,th-50),"white")
              im.thumbnail((tw-30,th-65),Image.Resampling.LANCZOS)
              bg.alpha_composite(im,((bg.width-im.width)//2,(bg.height-im.height)//2))
              x=(i%cols)*tw+10; y=(i//cols)*th+10
              sheet.paste(bg.convert("RGB"),(x,y))
              draw.text((x,y+th-42),mid+"  "+rec.get("alt","")[:42],fill="black")
          out=root/"research/visual-audits"; out.mkdir(parents=True,exist_ok=True)
          sheet.save(out/"presentation-contact-sheet.jpg",quality=88,optimize=True)
      - name: Validate candidate originals
        run: |
          pip install -r requirements-docs.txt
          python scripts/normalize_model_visuals.py --registry data/model-visuals.json --root . --output-root .site-image-pilot
          python scripts/verify_model_visuals.py --registry .site-image-pilot/data/model-visuals.json --root .site-image-pilot --models models/THE_LIST.md
          python scripts/build_visual_contact_sheet.py
          python scripts/audit_presentation_geometry.py
      - name: Commit candidate originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/models/original data/model-visuals.json research/visual-audits/presentation-contact-sheet.jpg research/visual-audits/presentation-contact-sheet.jpg research/visual-audits/presentation-geometry-audit.md
          if git diff --cached --quiet; then
            echo "No new candidate images"
            exit 0
          fi
          git commit -m "Acquire manufacturer-page candidate presentation images"
          git push origin HEAD:presentation-mission
