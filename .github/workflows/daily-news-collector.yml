name: Daily institutional knowledge intake

on:
  schedule:
    # GitHub Actions cron is UTC. Run both possible UTC equivalents of
    # 11:51 PM America/New_York, then gate on the current Eastern offset.
    - cron: "51 3 * * *"  # 11:51 PM EDT
    - cron: "51 4 * * *"  # 11:51 PM EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-intake-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce 11:51 PM Eastern cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested."
            exit 0
          fi

          OFFSET="$(TZ=America/New_York date +%z)"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$SCHEDULE" = "51 3 * * *" ] && [ "$OFFSET" = "-0400" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "51 4 * * *" ] && [ "$OFFSET" = "-0500" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        if: steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Open durable knowledge-intake branch
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "glassesresearch-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          if git ls-remote --exit-code --heads origin knowledge-intake >/dev/null 2>&1; then
            git fetch origin knowledge-intake
            git checkout -B knowledge-intake origin/knowledge-intake
            git merge --no-edit origin/main
          else
            git checkout -B knowledge-intake origin/main
          fi

      - name: Validate classifier
        if: steps.cadence.outputs.run == 'true'
        run: python scripts/test_knowledge_flow.py

      - name: Preserve previous same-day snapshots
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          STAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          for DIR in research/news-candidates research/discovery-candidates; do
            for EXT in json md; do
              SRC="${DIR}/${DATE}.${EXT}"
              if [ -f "$SRC" ]; then
                mv "$SRC" "${DIR}/${STAMP}.${EXT}"
              fi
            done
          done

      - name: Collect recent news and adjacent-HCI candidates
        if: steps.cadence.outputs.run == 'true'
        run: python scripts/collect_daily_news.py

      - name: Collect broad-web discovery candidates
        if: steps.cadence.outputs.run == 'true'
        run: python scripts/collect_web_discovery.py

      - name: Retain durable discovered-source watches
        if: steps.cadence.outputs.run == 'true'
        run: python scripts/collect_discovery_watches.py

      - name: Persist durable intake queue
        if: steps.cadence.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add research/news-candidates research/discovery-candidates
          if ! git diff --cached --quiet; then
            DATE="$(TZ=America/New_York date +%F)"
            git commit -m "Persist institutional knowledge intake ${DATE}"
          fi
          git push origin HEAD:knowledge-intake

          {
            echo "### Durable knowledge intake"
            echo ""
            echo "News and broad-web discovery are preserved on the \`knowledge-intake\` branch."
            echo "Candidates are classified before review; no PR is required for the conveyor to retain its payload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inactive DST counterpart
        if: steps.cadence.outputs.run == 'false'
        run: echo "This UTC schedule is inactive for the current Eastern offset; no collection performed."
