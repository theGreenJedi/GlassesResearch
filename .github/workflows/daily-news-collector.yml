name: Daily institutional knowledge intake

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect glasses and adjacent HCI candidates
        run: python scripts/collect_daily_news.py

      - name: Detect intake changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- research/news-candidates)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open research-inbox PR when new candidates exist
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          BRANCH="knowledge-intake-${DATE}-${GITHUB_RUN_ID}"
          git config user.name "glassesresearch-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add research/news-candidates
          git commit -m "Collect institutional knowledge intake for ${DATE}"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Institutional knowledge intake — ${DATE}" \
            --body "Automated research inbox only. Collect broadly, publish selectively. Core smart-glasses candidates may be promoted only after editorial review. Adjacent HCI candidates are retained as research radar and must not become public site content until a concrete smart-glasses/eyewear connection exists. Review dispositions: collected, watch, archived, published, superseded, rejected."

      - name: No new candidates
        if: steps.changes.outputs.changed == 'false'
        run: echo "No new research-inbox candidates; no PR opened."
