name: Release tracker freshness

on:
  pull_request:
    paths:
      - "docs/news/RELEASE_TRACKER.md"
      - "scripts/check_release_tracker_freshness.py"
      - ".github/workflows/release-tracker-freshness.yml"
  push:
    branches: [main]
    paths:
      - "docs/news/RELEASE_TRACKER.md"
      - "scripts/check_release_tracker_freshness.py"
      - ".github/workflows/release-tracker-freshness.yml"
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-tracker-review-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a recently verified release tracker
        run: >-
          python scripts/check_release_tracker_freshness.py
          docs/news/RELEASE_TRACKER.md
          --max-age-days 7
