site_name: GlassesResearch
site_description: Evidence-based research into AI eyeglasses, smart eyewear, and open user-controlled ecosystems.
site_url: https://glassesresearch.org/
repo_url: https://github.com/theGreenJedi/GlassesResearch
repo_name: theGreenJedi/GlassesResearch
edit_uri: edit/main/
docs_dir: .site-src
site_dir: site
strict: false

hooks:
  - scripts/seo_hook.py

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view

plugins:
  - search

extra_css:
  - docs/stylesheets/site-nav.css
  - docs/stylesheets/visual-system.css
  - docs/stylesheets/industry-timeline.css
  - docs/stylesheets/comparison-engine.css
  - docs/stylesheets/finder-advanced.css
  - docs/stylesheets/finder-shortlist.css
  - docs/stylesheets/homepage-finder.css

extra_javascript:
  - docs/javascripts/model-links.js
  - docs/javascripts/community-welcome.js
  - docs/javascripts/cloudflare-web-analytics.js
  - docs/javascripts/industry-timeline.js
  - docs/javascripts/site-search.js
  - docs/javascripts/glasses-finder-v3.js
  - docs/javascripts/homepage-finder.js
  - docs/javascripts/finder-shortlist.js
  - docs/javascripts/purchase-fallbacks.js
  - docs/javascripts/purchase-link-health.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Contents: docs/CONTENTS.md
  - Finder: docs/COMPARISON_ENGINE.md
  - Research & News:
      - Research & News: docs/RESEARCH_NEWS.md
      - Industry Timeline: docs/INDUSTRY_TIMELINE.md
      - News Archive & Trackers: docs/news/README.md
      - Technical Resources: evidence/README.md
      - Historical Archive: docs/HISTORICAL_ARCHIVE.md
  - Tools:
      - Tools Overview: docs/TOOLS.md
      - Find & Compare:
          - Glasses Finder & Compare: docs/COMPARISON_ENGINE.md
          - Browse All Smart Glasses: models/THE_LIST.md
          - Start by What You Need: docs/START_BY_NEED.md
          - Buyer Guide: buyers/BUYER_AND_OPENNESS_GUIDE.md
      - Report Cards & Research:
          - Report Card: docs/REPORT_CARD.md
          - Model Research: models/README.md
          - Technology Lineages:
              - Overview: lineages/README.md
              - HeyCyan: lineages/HEYCYAN.md
              - HeyCyan Population: lineages/HEYCYAN_POPULATION.md
              - Meta: lineages/META.md
              - Google Glass: lineages/GOOGLE_GLASS.md
              - Vuzix: lineages/VUZIX.md
              - XREAL / Nreal: lineages/XREAL.md
              - Brilliant Labs: lineages/BRILLIANT_LABS.md
              - Brilliant Labs Population: lineages/BRILLIANT_LABS_POPULATION.md
              - Snap Spectacles: lineages/SNAP.md
              - Solos AirGo: lineages/SOLOS.md
          - Companion App Database: docs/COMPANION_APP_DATABASE.md
          - Survival / Cloud-Independence Matrix: docs/SURVIVAL_MATRIX.md
      - Development & Hacking:
          - Development & Hacking: hacking/README.md
          - SDK / API Compatibility Matrix: docs/SDK_API_MATRIX.md
          - Projects & SDKs: hacking/OPEN_HACKING_RESOURCE_LEDGER.md
          - Ecosystem Resource Catalog: resources/ECOSYSTEM_RESOURCE_CATALOG.md
          - Manuals, Firmware & Technical Files: artifacts/README.md
      - Methods & Reference:
          - Hands-On Test Protocol: docs/HANDS_ON_TEST_PROTOCOL.md
          - Technology Primers: docs/TECHNOLOGY_PRIMERS.md
          - Wearable-HCI Taxonomy: docs/taxonomy/WEARABLE_HCI.md
          - Adjacent Wearable-HCI: models/ADJACENT_WEARABLES.md
          - Questions & Answers: docs/faq/README.md
          - Community: resources/COMMUNITY_AND_DEVELOPMENT.md
          - Glossary: glossary/README.md
  - About:
      - About GlassesResearch: docs/ABOUT.md
      - Research Standards: docs/RESEARCH_STANDARDS.md
      - Challenge Our Research: docs/RESEARCH_CHALLENGES.md
      - Hall of Contributors: docs/CONTRIBUTORS.md
      - Contribute: docs/CONTRIBUTE.md
