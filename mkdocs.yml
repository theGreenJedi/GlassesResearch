site_name: GlassesResearch
site_description: Evidence-based research into AI eyeglasses, smart eyewear, and open user-controlled ecosystems.
site_url: https://glassesresearch.org/
repo_url: https://github.com/theGreenJedi/GlassesResearch
repo_name: theGreenJedi/GlassesResearch
edit_uri: edit/main/
docs_dir: .site-src
site_dir: site
strict: false

hooks:
  - scripts/seo_hook.py

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view

plugins:
  - search

extra_css:
  - docs/stylesheets/site-nav.css
  - docs/stylesheets/industry-timeline.css
  - docs/stylesheets/comparison-engine.css

extra_javascript:
  - docs/javascripts/model-links.js
  - docs/javascripts/community-welcome.js
  - docs/javascripts/cloudflare-web-analytics.js
  - docs/javascripts/industry-timeline.js
  - docs/javascripts/site-search.js
  - docs/javascripts/comparison-engine.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Devices:
      - Browse All Devices: models/THE_LIST.md
      - Start by What You Need: docs/START_BY_NEED.md
      - Start Here: docs/START_HERE.md
      - Buyer Guide: buyers/BUYER_AND_OPENNESS_GUIDE.md
      - Compare Devices: docs/COMPARISON_ENGINE.md
      - W610 Research:
          - W610 Overview: models/W610/README.md
          - Questions & Answers: models/W610/QUESTIONS.md
          - Developer & Hacking Research: models/W610/hacking/README.md
          - Research Sources: models/W610/resources/RESEARCH_PORTAL.md
          - Community Resources: models/W610/COMMUNITY_MAP.md
  - Research:
      - Industry Timeline: docs/INDUSTRY_TIMELINE.md
      - Historical Archive: docs/HISTORICAL_ARCHIVE.md
      - News & Updates: docs/news/README.md
      - Latest Digest: docs/news/digests/2026-08-05.md
      - Release Tracker: docs/news/RELEASE_TRACKER.md
      - Research Library: evidence/README.md
      - Manuals, Firmware & Technical Files: artifacts/README.md
      - Resource Preservation: docs/PRESERVATION.md
      - History & Museum: docs/MUSEUM.md
  - Developer Resources:
      - Open Development & Hacking: hacking/README.md
      - Concrete Projects & Resources: hacking/OPEN_HACKING_RESOURCE_LEDGER.md
      - Software, Firmware & SDK Sources: resources/ECOSYSTEM_RESOURCE_CATALOG.md
      - W610 Development Research: models/W610/hacking/README.md
  - Questions:
      - Question Index: docs/faq/README.md
      - Ask Your Own Question: docs/faq/ASK_YOUR_OWN_QUESTION.md
      - Community Questions: docs/faq/COMMUNITY_QUESTIONS.md
      - Basics: docs/faq/01-basics.md
      - Buying: docs/faq/02-buying.md
      - Use Cases: docs/faq/03-use-cases.md
      - Battery: docs/faq/04-battery.md
      - Displays: docs/faq/05-displays.md
      - AI, Cameras & Audio: docs/faq/06-ai-cameras-audio.md
      - Privacy & Security: docs/faq/07-privacy-security.md
      - Accessibility & Fit: docs/faq/08-accessibility-fit.md
      - Development & Openness: docs/faq/09-development-openness.md
      - Ownership & Future: docs/faq/10-ownership-future.md
  - Glossary: glossary/README.md
  - Project:
      - About GlassesResearch: docs/ABOUT.md
      - Roadmap v1.0: docs/ROADMAP_V1.md
      - Research Standards: docs/RESEARCH_STANDARDS.md
      - Challenge Our Research: docs/RESEARCH_CHALLENGES.md
      - Hall of Contributors: docs/CONTRIBUTORS.md
      - Contribute: docs/CONTRIBUTE.md
      - Technical Index:
          - Device Data: models/DEVICE_DATABASE.md
          - Model Registry: models/CATALOG.md
          - Model Chapters: models/README.md
          - Preserved Artifact Records: resources/PRIMARY_ARTIFACT_PRESERVATION_LEDGER.md
          - SEO & Discoverability: docs/SEO_DISCOVERABILITY.md
