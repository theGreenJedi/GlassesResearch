site_name: GlassesResearch
site_description: Evidence-based research into AI eyeglasses, smart eyewear, and open user-controlled ecosystems.
site_url: https://glassesresearch.org/
docs_dir: .site-src
site_dir: site
strict: false

hooks:
  - scripts/repository_research_link_hook.py
  - scripts/seo_hook.py
  - scripts/build_social_card.py
  - scripts/model_hub_hook.py

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight

plugins:
  - search

extra_css:
  - docs/stylesheets/visual-system.css
  - docs/stylesheets/industry-timeline.css
  - docs/stylesheets/comparison-engine.css
  - docs/stylesheets/comparison-readable.css
  - docs/stylesheets/finder-advanced.css
  - docs/stylesheets/finder-shortlist.css
  - docs/stylesheets/homepage-finder.css
  - docs/stylesheets/homepage-overview.css
  - docs/stylesheets/editorial-graphics.css
  - docs/stylesheets/report-card-visuals.css
  - docs/stylesheets/original-visuals.css
  - docs/stylesheets/mobile-first.css
  - docs/stylesheets/verified-research-alerts.css
  - docs/stylesheets/model-knowledge-flow.css
  - docs/stylesheets/community-review.css
  - docs/stylesheets/family-tree.css
  - docs/stylesheets/research-news-newsroom.css
  - docs/stylesheets/newsroom-publication-shell.css
  - docs/stylesheets/ecosystem-constellation.css
  - docs/stylesheets/site-nav.css

extra_javascript:
  - docs/javascripts/model-links.js
  - docs/javascripts/community-welcome.js
  - docs/javascripts/cloudflare-web-analytics.js
  - docs/javascripts/industry-timeline.js
  - docs/javascripts/site-search.js
  - docs/javascripts/unified-left-rail.js
  - docs/javascripts/glasses-finder-v3.js
  - docs/javascripts/lineage-alias-search.js
  - docs/javascripts/comparison-readable.js
  - docs/javascripts/homepage-finder.js
  - docs/javascripts/homepage-overview.js
  - docs/javascripts/finder-shortlist.js
  - docs/javascripts/purchase-fallbacks.js
  - docs/javascripts/purchase-link-health.js
  - docs/javascripts/report-card-visuals.js
  - docs/javascripts/original-visuals.js
  - docs/javascripts/verified-research-alerts.js
  - docs/javascripts/feed-choice.js
  - docs/javascripts/model-knowledge-flow.js
  - docs/javascripts/community-review-intake.js
  - docs/javascripts/community-review-model.js
  - docs/javascripts/family-tree.js
  - docs/javascripts/cite-this-model.js
  - docs/javascripts/research-news-newsroom.js
  - docs/javascripts/ecosystem-constellation.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false

nav:
  - Finder: docs/COMPARISON_ENGINE.md
  - Ecosystem: docs/ECOSYSTEM_MAP.md
  - Research & News: docs/RESEARCH_NEWS.md
  - Tools: docs/TOOLS.md
  - Contribute: docs/COMMUNITY_REVIEWS.md
  - About: docs/ABOUT.md
