      - Start by What You Need: docs/START_BY_NEED.md
      - Buyer Guide: buyers/BUYER_AND_OPENNESS_GUIDE.md
      - Compare Devices: docs/COMPARISON_ENGINE.md
      - Report Card: docs/REPORT_CARD.md
      - Research Chapters:
          - Ray-Ban Meta Gen 2: models/RayBanMetaGen2/README.md
          - Bose Frames: models/BoseFrames/README.md
