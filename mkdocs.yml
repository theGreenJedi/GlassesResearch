site_name: GlassesResearch
site_description: Evidence-based research into AI eyeglasses, smart eyewear, and open user-controlled ecosystems.
site_url: https://thegreenjedi.github.io/GlassesResearch/
repo_url: https://github.com/theGreenJedi/GlassesResearch
repo_name: theGreenJedi/GlassesResearch
edit_uri: edit/main/
docs_dir: .site-src
site_dir: site
strict: false

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Why: WHY.md
  - The List: models/THE_LIST.md
  - Ecosystem:
      - Scope: docs/ECOSYSTEM_SCOPE.md
      - Model Registry: models/CATALOG.md
      - Model Chapters: models/README.md
  - Research & News:
      - News Hub: docs/news/README.md
      - Latest Digest: docs/news/digests/2026-08-05.md
      - Release Tracker: docs/news/RELEASE_TRACKER.md
      - Source Watchlist: docs/news/SOURCES.md
      - Weekly Workflow: docs/news/WORKFLOW.md
  - 100 Questions:
      - FAQ Index: docs/faq/README.md
      - Basics: docs/faq/01-basics.md
      - Buying: docs/faq/02-buying.md
      - Use Cases: docs/faq/03-use-cases.md
      - Battery: docs/faq/04-battery.md
      - Displays: docs/faq/05-displays.md
      - AI, Cameras & Audio: docs/faq/06-ai-cameras-audio.md
      - Privacy & Security: docs/faq/07-privacy-security.md
      - Accessibility & Fit: docs/faq/08-accessibility-fit.md
      - Development & Openness: docs/faq/09-development-openness.md
      - Ownership & Future: docs/faq/10-ownership-future.md
  - W610:
      - Chapter: models/W610/README.md
      - Questions: models/W610/QUESTIONS.md
      - Timeline: models/W610/TIMELINE.md
      - Genealogy: models/W610/GENEALOGY.md
      - Community Map: models/W610/COMMUNITY_MAP.md
      - Research Backlog: models/W610/RESEARCH_BACKLOG.md
      - Research Portal: models/W610/resources/RESEARCH_PORTAL.md
      - Hardware: models/W610/hardware/README.md
      - BLE: models/W610/ble/README.md
      - Firmware: models/W610/firmware/README.md
      - Software: models/W610/software/README.md
      - Manufacturing: models/W610/manufacturing/README.md
      - Diagnostics: models/W610/diagnostics/README.md
      - Engineering: models/W610/engineering/README.md
  - Glossary:
      - Overview: glossary/README.md
      - Organizations:
          - HeyCyan / Qingcheng Future: glossary/organizations/ORG-0001-hecyan-qingcheng-future.md
          - Goodway Techs: glossary/organizations/ORG-0002-goodway-techs.md
          - Dongguan Zhiyang: glossary/organizations/ORG-0003-dongguan-zhiyang.md
      - Components:
          - JL7018F: glossary/components/CMP-0001-jl7018f.md
          - Allwinner V821L2: glossary/components/CMP-0002-allwinner-v821l2.md
      - Applications:
          - HeyCyan: glossary/applications/APP-0001-hecyan.md
      - Standards:
          - Bluetooth SIG: glossary/standards/STD-0001-bluetooth-sig.md
          - FCC Equipment Authorization: glossary/standards/STD-0002-fcc-equipment-authorization.md
  - Project:
      - Vision: docs/PROJECT_VISION.md
      - Ecosystem Scope: docs/ECOSYSTEM_SCOPE.md
      - Repository Laws: docs/REPOSITORY_LAWS.md
      - Investigation Workflow: docs/INVESTIGATION_WORKFLOW.md
      - Evidence Standard: docs/EVIDENCE_STANDARD.md
      - KISS Working Notes: docs/KISS_WORKING_NOTES.md
      - Website: docs/WEBSITE.md
