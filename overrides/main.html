{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% set canonical_url = config.site_url.rstrip('/') ~ '/' ~ page.url %}
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GlassesResearch">
  <meta property="og:title" content="{{ page.title }} | GlassesResearch">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title }} | GlassesResearch">
  <meta name="twitter:description" content="{{ config.site_description }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "GlassesResearch",
    "url": "{{ config.site_url }}",
    "description": "{{ config.site_description }}",
    "publisher": {
      "@type": "Organization",
      "name": "GlassesResearch",
      "url": "{{ config.site_url }}"
    }
  }
  </script>
{% endblock %}
